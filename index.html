<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#07070c">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>原子序塔防2 — 原型 v0.24</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }

  :root {
    --u: min(1vw, 1vh);
    --safe-top:    max(16px, env(safe-area-inset-top, 0px));
    --safe-left:   max(22px, env(safe-area-inset-left, 0px));
    --safe-right:  max(22px, env(safe-area-inset-right, 0px));
    --safe-bottom: max(18px, env(safe-area-inset-bottom, 0px));
  }

  html, body {
    width:100%; height:100%;
    height: 100vh;
    height: 100dvh;
    overflow:hidden;
    background:#07070c;
    color:#e8e8f0;
    font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }

  canvas {
    display:block; position:fixed; inset:0;
    touch-action:none;
    -webkit-user-drag:none;
    user-drag:none;
    image-rendering:auto;
  }
  img { pointer-events:none; -webkit-user-drag:none; user-drag:none; }

  .hand-scroll, .indexMenu, .settings-body {
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  /* ============ HUD ============ */
  .hud { position:fixed; top: var(--safe-top); left: var(--safe-left); z-index:10; pointer-events:none; }
  .hud-row { display:flex; gap:10px; align-items:baseline; margin-bottom:4px;
    font-size: clamp(10px, calc(var(--u)*1.1), 12px); color:#778; letter-spacing:1px; }
  .hud-val { color:#e8e8f0; font-weight:700;
    font-size: clamp(13px, calc(var(--u)*1.6), 18px); font-variant-numeric:tabular-nums; }
  .gold .hud-val { color:#ffd166; }
  .hp .hud-val { color:#ff6b6b; }
  .units .hud-val { color:#c8b8ff; }

  .score-panel { position:fixed; top: calc(var(--safe-top) - 2px); left:50%; transform:translateX(-50%);
    z-index:10; text-align:center; pointer-events:none; }
  .score-label { font-size: clamp(9px, calc(var(--u)*0.9), 11px); color:#667; letter-spacing:4px; margin-bottom:2px; }
  .score-value { font-size: clamp(28px, calc(var(--u)*4.6), 44px); font-weight:800; color:#6bc4ff;
    font-variant-numeric:tabular-nums; letter-spacing:2px;
    text-shadow:0 0 24px rgba(107,196,255,0.55); line-height:1; }
  .score-sub { font-size: clamp(10px, calc(var(--u)*1.1), 12px); color:#889; letter-spacing:1px; margin-top:4px; }

  .toast-container { position:fixed; top: calc(var(--safe-top) + 110px); left:50%; transform:translateX(-50%);
    z-index:20; display:flex; flex-direction:column; align-items:center;
    gap:6px; pointer-events:none; }
  .toast { padding: clamp(5px, calc(var(--u)*0.8), 8px) clamp(12px, calc(var(--u)*2), 22px);
    border-radius:999px; background:rgba(10,14,24,0.9);
    border:2px solid; font-weight:800; font-size: clamp(13px, calc(var(--u)*1.8), 20px);
    letter-spacing:1px; white-space:nowrap;
    animation: toastIn 0.25s ease-out, toastOut 0.5s ease-in 1.4s forwards; }
  @keyframes toastIn { from { opacity:0; transform:translateY(-14px) scale(0.9); } to { opacity:1; transform:translateY(0) scale(1); } }
  @keyframes toastOut { to { opacity:0; transform:translateY(-20px); } }

  .hud-right { position:fixed; top: var(--safe-top); right: var(--safe-right); z-index:10; text-align:right; }
  .hud-right .hud-row { justify-content:flex-end; }

  /* ============ 底部面板 ============ */
  .panel {
    position:fixed; left:50%; transform:translateX(-50%); z-index:10;
    bottom: var(--safe-bottom);
    display:flex; gap: clamp(6px, calc(var(--u)*0.9), 10px);
    align-items:center; background:rgba(14,16,26,0.9);
    backdrop-filter:blur(16px); border:1px solid #252a3e; border-radius:16px;
    padding: clamp(6px, calc(var(--u)*0.9), 10px) clamp(8px, calc(var(--u)*1.2), 14px);
    box-shadow:0 8px 40px rgba(0,0,0,0.65); max-width:96vw;
    height: clamp(64px, calc(var(--u)*8.5), 88px);
  }
  .panel-label { font-size: clamp(8px, calc(var(--u)*0.9), 10px); color:#667; letter-spacing:2px;
    writing-mode:vertical-rl; text-orientation:mixed; padding:2px 0; flex-shrink:0; }

  .hand-scroll {
    overflow-x:auto; overflow-y:hidden;
    max-width: 48vw;
    padding:2px 2px 6px 2px;
    height: clamp(48px, calc(var(--u)*6.2), 68px);
    flex-shrink:0;
    touch-action: pan-x;
  }
  .hand-scroll::-webkit-scrollbar { height:6px; }
  .hand-scroll::-webkit-scrollbar-thumb { background:#252a3e; border-radius:3px; }
  .hand-scroll::-webkit-scrollbar-thumb:hover { background:#3a4055; }
  .hand { display:flex; gap:8px; height:100%; align-items:center; }

  .hand-slot {
    width: clamp(38px, calc(var(--u)*5), 52px);
    height: clamp(38px, calc(var(--u)*5), 52px);
    border-radius:10px; display:flex;
    align-items:center; justify-content:center;
    font-weight:800; font-size: clamp(12px, calc(var(--u)*1.6), 17px);
    border:2px solid transparent; cursor:pointer; transition:all 0.12s;
    position:relative; flex-shrink:0;
  }
  .hand-slot:hover { transform:translateY(-3px); filter:brightness(1.15); }
  .hand-slot.selected { border-color:#6bc4ff; box-shadow:0 0 16px rgba(107,196,255,0.75); transform:translateY(-4px); }
  .hand-slot.drag-mode { cursor: grab; }
  .hand-slot.drag-mode:active { cursor: grabbing; }

  .btn {
    padding: clamp(6px, calc(var(--u)*0.85), 10px) clamp(10px, calc(var(--u)*1.4), 16px);
    border-radius:10px; border:none;
    background:linear-gradient(135deg,#3a7bd5,#2a5fa5); color:#fff;
    font-weight:700; font-size: clamp(10px, calc(var(--u)*1.1), 13px);
    cursor:pointer; transition:all 0.12s;
    font-family:inherit; letter-spacing:1px; flex-shrink:0; white-space:nowrap;
  }
  .btn:not(:disabled):hover { background:linear-gradient(135deg,#4a8be5,#3a6fb5); transform:translateY(-1px); }
  .btn:not(:disabled):active { transform:translateY(0); }
  .btn:disabled { background:#1c2030; color:#445; cursor:not-allowed; transform:none; box-shadow:none; }

  .btn-roll { background:linear-gradient(135deg,#f0932b,#d97e1a); }
  .btn-roll:not(:disabled):hover { background:linear-gradient(135deg,#ffa33b,#e98e2a); }
  .btn-buy { background:linear-gradient(135deg,#8a5cd0,#6a3fa8); }
  .btn-buy:not(:disabled):hover { background:linear-gradient(135deg,#9a6ce0,#7a4fb8); }

  .btn-sell { background:linear-gradient(135deg,#a04848,#7a3030); min-width: clamp(62px, calc(var(--u)*8.2), 82px); }
  .btn-sell:not(:disabled):hover { background:linear-gradient(135deg,#b85858,#8a4040); }
  .btn-sell:disabled { background:#1c2030; color:#445; }
  .btn-sell.btn-dragover {
    background:linear-gradient(135deg,#ff6b6b,#e04040) !important;
    box-shadow:0 0 24px rgba(255,90,90,0.85) !important;
    transform:scale(1.1) !important;
    color:#fff !important;
  }
  .btn-sell.btn-drop-target { animation: sellPulse 1.1s ease-in-out infinite; }
  @keyframes sellPulse { 0%,100% { box-shadow:0 0 0 rgba(200,72,72,0); } 50% { box-shadow:0 0 14px rgba(200,72,72,0.6); } }

  /* ============ 右侧控件 ============ */
  .view-controls {
    position:fixed; right: var(--safe-right);
    bottom: calc(var(--safe-bottom) + 112px);
    z-index:11; display:flex; flex-direction:column; gap:8px;
  }
  .view-btn {
    width: clamp(32px, calc(var(--u)*4), 42px);
    height: clamp(32px, calc(var(--u)*4), 42px);
    border-radius:10px; border:1px solid #2e3550;
    background:rgba(14,16,26,0.9); color:#889; cursor:pointer;
    font-size: clamp(12px, calc(var(--u)*1.4), 16px);
    font-weight:700; transition:all 0.12s;
    display:flex; align-items:center; justify-content:center; font-family:inherit;
  }
  .view-btn:hover { background:rgba(30,36,54,0.95); color:#6bc4ff; border-color:#6bc4ff; }
  .view-btn:active { transform:scale(0.94); }
  .view-btn.active { background:rgba(60,90,150,0.95); color:#6bc4ff; border-color:#6bc4ff;
    box-shadow:0 0 12px rgba(107,196,255,0.4); }

  /* ============ 暂停遮罩 ============ */
  .pause-overlay {
    position:fixed; inset:0; z-index:90;
    background:rgba(7,7,12,0.6); backdrop-filter:blur(4px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:auto; cursor:pointer;
    animation:fadeIn 0.15s ease-out;
    -webkit-tap-highlight-color: transparent;
  }
  @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
  .pause-text { font-size: clamp(36px, calc(var(--u)*7), 64px); font-weight:800; color:#6bc4ff;
    letter-spacing: clamp(6px, calc(var(--u)*1.2), 12px);
    text-shadow:0 0 40px rgba(107,196,255,0.7); pointer-events:none; }
  .pause-hint { font-size: clamp(11px, calc(var(--u)*1.4), 15px); color:#9aa;
    letter-spacing:4px; margin-top:18px;
    pointer-events:none; animation: pauseBlink 1.6s ease-in-out infinite; }
  @keyframes pauseBlink { 0%,100% { opacity:0.6 } 50% { opacity:1 } }

  /* ============ 设置面板 ============ */
  .settings-overlay { position:fixed; inset:0; z-index:94;
    background:rgba(7,7,12,0.65); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    animation:fadeIn 0.15s ease-out; }
  .settings-panel { background:rgba(18,22,34,0.98);
    border:1px solid #2e3550; border-radius:16px;
    width: clamp(300px, 80vw, 460px); max-width:92vw;
    box-shadow:0 16px 56px rgba(0,0,0,0.8);
    animation:menuIn 0.15s ease-out;
    overflow:hidden; }
  @keyframes menuIn { from { opacity:0; transform:scale(0.94); } to { opacity:1; transform:scale(1); } }
  .settings-header { display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid #252a3e; }
  .settings-title { font-size:17px; font-weight:800; color:#e8e8f0; letter-spacing:3px; }
  .settings-close { width:30px; height:30px; border-radius:8px; border:none;
    background:transparent; color:#778; cursor:pointer;
    font-size:22px; font-weight:700; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.12s; font-family:inherit; }
  .settings-close:hover { background:rgba(255,255,255,0.08); color:#e8e8f0; }
  .settings-body { padding:6px 20px 14px; max-height:65vh; overflow-y:auto; }
  .settings-body::-webkit-scrollbar { width:6px; }
  .settings-body::-webkit-scrollbar-thumb { background:#252a3e; border-radius:3px; }
  .settings-body::-webkit-scrollbar-thumb:hover { background:#3a4055; }

  .setting-item { display:flex; align-items:center; justify-content:space-between;
    padding:14px 0; border-bottom:1px solid rgba(46,53,80,0.5); gap:16px; }
  .setting-item:last-child { border-bottom:none; }
  .setting-label { flex:1; min-width:0; }
  .setting-name { font-size:14px; font-weight:700; color:#e8e8f0; margin-bottom:3px; }
  .setting-desc { font-size:11px; color:#778; line-height:1.5; }

  .setting-seg { display:flex; background:rgba(10,14,24,0.8);
    border:1px solid #2e3550; border-radius:8px;
    padding:3px; flex-shrink:0; }
  .seg-btn { padding:6px 14px; border:none; background:transparent;
    color:#778; font-family:inherit; font-size:12px; font-weight:700;
    cursor:pointer; border-radius:6px; transition:all 0.12s;
    letter-spacing:0.5px; }
  .seg-btn:hover { color:#b8c0d0; }
  .seg-btn.active { background:linear-gradient(135deg,#3a7bd5,#2a5fa5);
    color:#fff; box-shadow:0 2px 8px rgba(58,123,213,0.4); }
  .seg-btn.active:hover { color:#fff; }

  /* ============ 上下文菜单 ============ */
  .context-menu { position:fixed; z-index:200;
    background:rgba(18,22,34,0.96); backdrop-filter:blur(14px);
    border:1px solid #2e3550; border-radius:12px;
    padding:12px 14px;
    min-width: clamp(180px, 20vw, 220px);
    max-width: clamp(220px, 25vw, 280px);
    box-shadow:0 8px 32px rgba(0,0,0,0.7);
    font-size: clamp(11px, calc(var(--u)*1.05), 13px);
    line-height:1.55;
    animation:menuIn 0.12s ease-out;
    pointer-events:none; }
  .context-menu .context-btn { pointer-events:auto; }
  .context-title { font-weight:800; font-size:15px; color:#e8e8f0; margin-bottom:6px;
    border-bottom:1px solid #2e3550; padding-bottom:6px; }
  .context-title .sym { color:#6bc4ff; }
  .context-title .enemy-tag { color:#ff5a5a; font-size:11px; font-weight:600;
    letter-spacing:1px; margin-left:6px; padding:1px 6px;
    background:rgba(255,90,90,0.15); border-radius:4px; }
  .context-title .core-tag { color:#6bc4ff; font-size:11px; font-weight:600;
    letter-spacing:1px; margin-left:6px; padding:1px 6px;
    background:rgba(107,196,255,0.15); border-radius:4px; }
  .context-info { color:#9aa3b8; font-size:12px; margin-bottom:6px; letter-spacing:0.5px;
    white-space:pre-line; }
  .context-info .val { color:#e8e8f0; font-weight:700; }
  .context-info .hpval { color:#6be86b; font-weight:700; }
  .context-info .hpval.low { color:#ff5a5a; }
  .context-info .corehp { color:#6bc4ff; font-weight:700; }
  .context-info .corehp.low { color:#ff5a5a; }

  .context-effects { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; pointer-events: none; }
  .context-effects.hidden { display: none; }
  .eff-tag {
    position: relative; padding: 3px 8px; border-radius: 5px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
    border: 1px solid; pointer-events: auto; cursor: help;
    white-space: nowrap; transition: filter 0.12s;
  }
  .eff-tag:hover { filter: brightness(1.3); }
  .eff-tag.cat-aura-source { background: rgba(255,209,102,0.12); border-color: rgba(255,209,102,0.55); color: #ffd166; }
  .eff-tag.cat-aura-target { background: rgba(107,196,255,0.12); border-color: rgba(107,196,255,0.55); color: #6bc4ff; }
  .eff-tag.cat-element     { background: rgba(139,214,82,0.12);  border-color: rgba(139,214,82,0.55);  color: #8bd652; }
  .eff-tag.cat-special     { background: rgba(255,90,90,0.12);   border-color: rgba(255,90,90,0.55);   color: #ff5a5a; }
  .eff-tag.cat-global      { background: rgba(200,120,255,0.12); border-color: rgba(200,120,255,0.55); color: #c878ff; }
  .eff-tag::after {
    content: attr(data-tip); position: absolute;
    top: calc(100% + 6px); left: 0;
    background: rgba(10,14,24,0.98);
    border: 1px solid #3a4055; border-radius: 8px;
    padding: 8px 12px; white-space: pre-line;
    font-size: 11px; font-weight: 400; letter-spacing: 0.3px;
    color: #e8e8f0; visibility: hidden; opacity: 0;
    transition: opacity 0.1s; z-index: 300; pointer-events: none;
    width: max-content; max-width: 220px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    line-height: 1.5; text-align: left;
  }
  .eff-tag:hover::after { visibility: visible; opacity: 1; }

  .context-btn { width:100%; padding:8px; border-radius:8px; border:none;
    font-family:inherit; font-weight:700; font-size:13px; cursor:pointer;
    transition:all 0.12s; letter-spacing:1px; }
  .context-btn.sell { background:linear-gradient(135deg,#c84848,#a03030); color:#fff; }
  .context-btn.sell:hover { background:linear-gradient(135deg,#d85858,#b04040); }
  .context-btn.sell:active { transform:scale(0.98); }
  .context-btn.hidden { display:none; }

  /* ============ 结算面板 ============ */
  .overlay { position:fixed; inset:0; background:rgba(6,6,12,0.9);
    backdrop-filter:blur(12px); display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:100; }
  .overlay h1 { font-size: clamp(24px, calc(var(--u)*4.6), 36px); margin-bottom:6px;
    color:#ff5a5a; letter-spacing:4px; }
  .overlay .sub { color:#778; font-size:13px; letter-spacing:3px; margin-bottom:4px; }
  .overlay .big { font-size: clamp(40px, calc(var(--u)*8), 64px); color:#6bc4ff; font-weight:800;
    font-variant-numeric:tabular-nums; margin-bottom:18px; letter-spacing:2px;
    text-shadow:0 0 40px rgba(107,196,255,0.5); }
  .overlay .stat { color:#aab; font-size:15px; margin-bottom:4px; letter-spacing:1px; }
  .overlay .stat span { color:#e8e8f0; font-weight:700; font-variant-numeric:tabular-nums; }
  .hidden { display:none !important; }

  /* ============ 媒体查询 ============ */
  @media (max-width: 800px) {
    .panel { max-width: 98vw; }
    .hand-scroll { max-width: 44vw; }
    .btn-sell { min-width: 62px; }
    .context-menu { font-size: 11px; padding:10px 12px; }
    .context-title { font-size: 13px; }
    .context-info { font-size: 11px; }
    .eff-tag { font-size: 10px; padding: 2px 6px; }
  }

  @media (max-width: 600px) and (orientation: portrait) {
    .panel { height: 62px; padding: 6px 8px; gap: 5px; border-radius: 12px; }
    .hand-scroll { height: 46px; }
    .hand-slot { width: 40px; height: 40px; font-size: 13px; border-radius: 8px; }
    .btn { padding: 6px 9px; font-size: 10px; letter-spacing: 0.5px; }
    .btn-sell { min-width: 56px; }
    .view-controls { gap: 5px; bottom: calc(var(--safe-bottom) + 92px); }
    .view-btn { width: 32px; height: 32px; font-size: 13px; border-radius: 8px; }
    .toast-container { top: calc(var(--safe-top) + 78px); }
    .score-value { font-size: 26px; }
    .hud-val { font-size: 13px; }
  }

  @media (min-width: 1800px) {
    .hud { left: max(40px, env(safe-area-inset-left, 0px)); }
    .hud-right { right: max(40px, env(safe-area-inset-right, 0px)); }
    .view-controls { right: max(40px, env(safe-area-inset-right, 0px)); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="hud-row gold"><span>金币</span><span class="hud-val" id="goldDisplay">200</span></div>
  <div class="hud-row hp"><span>核心</span><span class="hud-val" id="hpDisplay">10000</span></div>
  <div class="hud-row units"><span>单位</span><span class="hud-val" id="unitDisplay">0/12</span></div>
</div>

<div class="score-panel">
  <div class="score-label">分数</div>
  <div class="score-value" id="scoreDisplay">0</div>
  <div class="score-sub">击杀 <span id="killDisplay">0</span> · 存活 <span id="timeDisplay">00:00</span></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="hud-right">
  <div class="hud-row"><span>阶段</span><span class="hud-val" id="stageDisplay">1</span></div>
  <div class="hud-row"><span>敌人</span><span class="hud-val" id="enemyDisplay">0</span></div>
  <div class="hud-row"><span>缩放</span><span class="hud-val" id="zoomDisplay">100%</span></div>
</div>

<div class="panel">
  <div class="panel-label">背包</div>
  <div class="hand-scroll"><div class="hand" id="hand"></div></div>
  <button class="btn btn-sell" id="sellHandBtn">卖掉</button>
  <button class="btn btn-roll" id="rollBtn">抽卡 · 20金</button>
  <button class="btn btn-buy" id="buyLimitBtn">增员 · 60金 (+2)</button>
</div>

<div class="view-controls">
  <button class="view-btn" id="pauseBtn" title="暂停 (空格)">⏸</button>
  <button class="view-btn" id="speedBtn" title="切换速度 (1/2/3)">×1</button>
  <button class="view-btn" id="settingsBtn" title="设置">⚙</button>
  <button class="view-btn" id="zoomInBtn" title="放大">+</button>
  <button class="view-btn" id="zoomOutBtn" title="缩小">−</button>
  <button class="view-btn" id="resetViewBtn" title="重置视角">⌖</button>
</div>

<div class="pause-overlay hidden" id="pauseOverlay">
  <div class="pause-text">已暂停</div>
  <div class="pause-hint">点击任意处继续</div>
</div>

<div class="settings-overlay hidden" id="settingsOverlay">
  <div class="settings-panel">
    <div class="settings-header">
      <span class="settings-title">设置</span>
      <button class="settings-close" id="settingsCloseBtn">×</button>
    </div>
    <div class="settings-body">
      <div class="setting-item">
        <div class="setting-label">

/* ============================================================

// 1. 阻止 iOS Safari 手势缩放
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => {
  document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
});

// 2. 阻止拖拽图片 / DOM 产生 ghost image
document.addEventListener('dragstart', (e) => e.preventDefault());
document.addEventListener('drop',      (e) => e.preventDefault());
document.addEventListener('dragover',  (e) => e.preventDefault());

// 3. 阻止鼠标中键自动滚动
document.addEventListener('mousedown', (e) => {
  if (e.button === 1) e.preventDefault();
});

// 4. 阻止 Ctrl/⌘ + 滚轮 缩放页面
window.addEventListener('wheel', (e) => {
  if (e.ctrlKey || e.metaKey) e.preventDefault();
}, { passive: false });

// 5. 阻止 Ctrl/⌘ + 加减号 缩放页面 & 常见干扰快捷键
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && ['+','-','=','0'].includes(e.key)) {
    e.preventDefault();
  }
  if ((e.ctrlKey || e.metaKey) && ['a','s','p'].includes(e.key.toLowerCase())) {
    e.preventDefault();
  }
});

// 6. 阻止长按 / 右键弹出上下文菜单
document.addEventListener('contextmenu', (e) => e.preventDefault());

// 7. 阻止 iOS 多指触摸引起页面缩放
const canvasEl = document.getElementById('game');
canvasEl.addEventListener('touchstart', (e) => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

// 8. 阻止 iOS 双击缩放在 canvas 上生效
let _lastCanvasTouchEnd = 0;
canvasEl.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - _lastCanvasTouchEnd <= 320) {
    e.preventDefault();
  }
  _lastCanvasTouchEnd = now;
}, { passive: false });

// 9. canvas 上阻止 touchmove 默认滚动（DOM 上的手牌滚动不受影响）
document.addEventListener('touchmove', (e) => {
  if (e.target === canvasEl) e.preventDefault();
}, { passive: false });

// 10. 阻止第二根手指按下时长按菜单弹出
document.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch' && e.isPrimary === false) {
    e.preventDefault();

}, { passive: false });

const camera = { x: 0, y: 0, zoom: 1, fitZoom: 1, initialized: false };

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function computeFitZoom() { return (Math.min(W, H) * 0.4) / WORLD.PLACE_MAX_R; }

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;

  // 用 CSS 变量兜底旧浏览器不支持 dvh
  document.documentElement.style.setProperty('--vh', (H * 0.01) + 'px');

  camera.fitZoom = computeFitZoom();
  if (!camera.initialized) {
    camera.x = 0; camera.y = 0;
    camera.zoom = camera.fitZoom;
    camera.initialized = true;
  } else {
    camera.zoom = clamp(camera.zoom, camera.fitZoom * 0.3, camera.fitZoom * 4);

}
window.addEventListener('resize', resize);

function screenToWorld(sx, sy) {
  return [(sx - W / 2) / camera.zoom + camera.x, (sy - H / 2) / camera.zoom + camera.y];
}
function worldToScreen(wx, wy) {
  return [(wx - camera.x) * camera.zoom + W / 2, (wy - camera.y) * camera.zoom + H / 2];
}
function applyCamera() {
  ctx.translate(W / 2, H / 2);
  ctx.scale(camera.zoom, camera.zoom);
  ctx.translate(-camera.x, -camera.y);
}
function updateZoomDisplay() {
  const el = document.getElementById('zoomDisplay');
  if (el) el.textContent = Math.round((camera.zoom / camera.fitZoom) * 100) + '%';
}
function resetCamera() {
  camera.x = 0; camera.y = 0;
  camera.zoom = camera.fitZoom;

}

function hexToRgba(hex, alpha) {
  if (!hex || hex[0] !== '#') return hex;
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

const CRIT_CHANCE = 0.10;
const CRIT_MULT = 2.0;
function calcDamage(baseAtk) {
  const isCrit = Math.random() < CRIT_CHANCE;
  return { dmg: isCrit ? baseAtk * CRIT_MULT : baseAtk, isCrit };
}

const ATOM_MASS = { H:1, O:16, Na:23, Cl:35.5, C:12 };
function computeMass(atoms) {
  return atoms.reduce((s, a) => s + (ATOM_MASS[a] || 1), 0);
}
function computeSizeFactor(atoms) {
  return 0.85 + 0.30 * Math.sqrt(computeMass(atoms) / 60);
}
