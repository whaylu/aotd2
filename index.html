function isSubset(a, b) {
  const bCopy = [...b];
  for (const item of a) {
    const idx = bCopy.indexOf(item);
    if (idx === -1) return false;
    bCopy.splice(idx, 1);
  }
  return true;
}
function findMoleculeMatch(atoms) {
  const sorted = [...atoms].sort();
  for (const key in DEFS) {
    const def = DEFS[key];
    if (def.tier === 0 || def.isIntermediate) continue;
    const defSorted = [...def.atoms].sort();
    if (defSorted.length === sorted.length &&
        defSorted.every((v, i) => v === sorted[i])) return key;
  }
  return null;
}
function findSupersetMolecule(atoms) {
  const sorted = [...atoms].sort();
  let best = null;
  for (const key in DEFS) {
    const def = DEFS[key];
    if (def.tier === 0 || def.isIntermediate) continue;
    const defSorted = [...def.atoms].sort();
    if (defSorted.length <= sorted.length) continue;
    if (isSubset(sorted, defSorted)) {
      if (!best || defSorted.length < DEFS[best].atoms.length) best = key;
    }
  }
  return best;
}
function buildIntermediateSymbol(atoms) {
  const counts = {};
  for (const a of atoms) counts[a] = (counts[a] || 0) + 1;
  const subs = ['','₂','₃','₄','₅','₆','₇','₈','₉'];
  return Object.entries(counts).map(([k, v]) => v > 1 ? k + subs[v] : k).join('');
}

function createIntermediate(atoms, x, y) {
  const sorted = [...atoms].sort();
  const key = 'IM:' + sorted.join('+');
  if (!DEFS[key]) {
    DEFS[key] = {
      atoms: sorted,
      name: '过渡态',
      symbol: buildIntermediateSymbol(sorted),
      color: '#5a6a7a',
      stroke: '#384858',
      atk: 0, range: 0, cd: 999,
      hp: 100 * HP_SCALE,
      tier: 1,
      isIntermediate: true,
    };
  }
  const def = DEFS[key];
  const unit = {
    id: Math.random().toString(36).slice(2),
    key, x, y,
    radius: WORLD.TOWER_BASE_R * computeSizeFactor(sorted),
    hp: def.hp, maxHp: def.hp,
    baseAtk: 0, baseRange: 0, baseCd: 999,
    atk: 0, range: 0, cd: 999,
    cdTimer: 999,
    atoms: [...sorted],
    hitFlash: 0,
    bonusDamage: 0, bonusCooldown: 0, bonusRange: 0,
    receivedAuras: {},
    isIntermediate: true,
  };
  state.units.push(unit);
  flashMessage(`过渡态 ${def.symbol}`, '#a0b8d0');
  return unit;
}
function placeUnit(key, x, y) {
  const def = DEFS[key];
  const unit = {
    id: Math.random().toString(36).slice(2),
    key, x, y,
    radius: WORLD.TOWER_BASE_R * computeSizeFactor(def.atoms),
    hp: def.hp * HP_SCALE,
    maxHp: def.hp * HP_SCALE,
    baseAtk: def.atk, baseRange: def.range, baseCd: def.cd,
    atk: def.atk, range: def.range, cd: def.cd,
    cdTimer: 0,
    atoms: [...def.atoms],
    hitFlash: 0,
    bonusDamage: 0, bonusCooldown: 0, bonusRange: 0,
    receivedAuras: {},
    isIntermediate: false,
  };
  state.units.push(unit);
  return unit;
}
function removeUnit(u) {
  const idx = state.units.indexOf(u);
  if (idx >= 0) state.units.splice(idx, 1);
  if (state.selectedUnit === u) {
    state.selectedUnit = null;
    hideContextMenu();
  }
}
function getUnitAtWorld(wx, wy, screenPadding = 6) {
  const tol = screenPadding / camera.zoom;
  let best = null, bestD = Infinity;
  for (const u of state.units) {
    const d = Math.hypot(u.x - wx, u.y - wy);
    if (d < u.radius + tol && d < bestD) { best = u; bestD = d; }
  }
  return best;
}
function getEnemyAtWorld(wx, wy, screenPadding = 6) {
  const tol = screenPadding / camera.zoom;
  let best = null, bestD = Infinity;
  for (const e of state.enemies) {
    const d = Math.hypot(e.x - wx, e.y - wy);
    if (d < e.radius + tol && d < bestD) { best = e; bestD = d; }
  }
  return best;
}
function getCoreAtWorld(wx, wy, screenPadding = 6) {
  const tol = screenPadding / camera.zoom;
  return Math.hypot(wx, wy) < WORLD.CORE_RADIUS + tol;
}
function tryPlace(wx, wy) {
  const d = Math.hypot(wx, wy);
  if (d < WORLD.PLACE_MIN_R || d > WORLD.PLACE_MAX_R) return false;
  if (state.units.length >= state.unitLimit) return false;
  for (const u of state.units) {
    if (Math.hypot(u.x - wx, u.y - wy) < u.radius + WORLD.TOWER_BASE_R * 0.7) return false;
  }
  return true;
}

function synthesizeWithHand(unit, handKey) {
  if (!unit || !handKey) return false;

  for (const rx of SPECIAL_REACTIONS) {
    if ((unit.key === rx.a && handKey === rx.b) ||
        (unit.key === rx.b && handKey === rx.a)) {
      const exX = unit.x, exY = unit.y;
      triggerExplosion(exX, exY, rx.damage, rx.radius);
      flashMessage(rx.hint, '#ffaa3a');

      const unitIsKeep = unit.key === rx.keep;
      const handIsKeep = handKey === rx.keep;

      if (unitIsKeep) {
        // 场上是保留物，手牌消耗
      } else if (handIsKeep) {
        removeUnit(unit);
        placeUnit(handKey, exX, exY);
      } else {
        removeUnit(unit);
      }
      return true;
    }
  }

  const handDef = DEFS[handKey];
  if (!handDef) return false;
  const all = [...unit.atoms, ...handDef.atoms].sort();

  const molKey = findMoleculeMatch(all);
  if (molKey) {
    const x = unit.x, y = unit.y;
    removeUnit(unit);
    placeUnit(molKey, x, y);
    flashMessage(`合成 ${DEFS[molKey].name}`, '#6bc4ff');
    return true;
  }
  if (all.length >= 2) {
    const superKey = findSupersetMolecule(all);
    if (superKey) {
      const x = unit.x, y = unit.y;
      removeUnit(unit);
      createIntermediate(all, x, y);
      return true;
    }
  }
  flashMessage('该组合不稳定', '#ff5a5a');
  return false;
}

function addParticle(p) {
  if (!state.showParticles) return;
  state.particles.push(p);
}

function triggerExplosion(x, y, damage, radius) {
  state.explosions.push({ x, y, radius, maxRadius: radius, life: 0.55, maxLife: 0.55 });
  for (const e of state.enemies) {
    const d = Math.hypot(e.x - x, e.y - y);
    if (d < radius) {
      const baseDmg = damage * (1 - d / radius * 0.5);
      const { dmg, isCrit } = calcDamage(baseDmg);
      e.hp -= dmg;
      showDamagePopup(e, dmg, { isCrit });
    }
  }
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 240 + 80;
    addParticle({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.5 + Math.random() * 0.4, maxLife: 0.9,
      color: i % 2 ? '#ffaa3a' : '#ff6030', size: 8 + Math.random() * 8,
    });
  }
}

const toastContainer = document.getElementById('toastContainer');
function flashMessage(text, color = '#ffaa3a') {
  while (toastContainer.children.length >= 5) {
    toastContainer.firstChild.remove();
  }
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  el.style.color = color;
  el.style.borderColor = color;
  toastContainer.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

function pushPopup(p) {
  state.popups.push(p);
  if (state.popups.length > 200) state.popups.shift();
}
function showDamagePopup(target, amount, opts = {}) {
  if (!state.showDamagePopups) return;
  const n = Math.max(0, Math.round(amount));
  if (n <= 0) return;
  const isCrit = !!opts.isCrit;
  pushPopup({
    x: target.x + (Math.random() - 0.5) * 24,
    y: target.y - 34 + (Math.random() - 0.5) * 10,
    vx: (Math.random() - 0.5) * 40,
    vy: -70 - Math.random() * 30,
    life: isCrit ? 1.15 : 0.9,
    maxLife: isCrit ? 1.15 : 0.9,
    text: String(n),
    color: isCrit ? '#ff3a3a' : '#ffffff',
    size: isCrit ? 30 : 20,
    isWorld: true,
    isCrit,
  });
}
function showCoreDamagePopup(amount) {
  if (!state.showDamagePopups) return;
  const n = Math.max(0, Math.round(amount));
  if (n <= 0) return;
  const a = Math.random() * Math.PI * 2;
  pushPopup({
    x: Math.cos(a) * WORLD.CORE_RADIUS * 0.7,
    y: Math.sin(a) * WORLD.CORE_RADIUS * 0.7 - 30,
    vx: (Math.random() - 0.5) * 40,
    vy: -70 - Math.random() * 30,
    life: 0.9, maxLife: 0.9,
    text: String(n),
    color: '#ffffff',
    size: 22,
    isWorld: true,
  });
}
function showGoldPopup(delta) {
  const sign = delta >= 0 ? '+' : '';
  pushPopup({
    x: 180 + (Math.random() - 0.5) * 24,
    y: 36 + (Math.random() - 0.5) * 8,
    vx: (Math.random() - 0.5) * 30,
    vy: -55,
    life: 0.9, maxLife: 0.9,
    text: `${sign}${Math.round(delta)}`,
    color: '#ffd166',
    size: 22,
    isWorld: false,
  });
}
function showScorePopup(delta) {
  const sign = delta >= 0 ? '+' : '';
  pushPopup({
    x: W / 2 + 130 + (Math.random() - 0.5) * 24,
    y: 46 + (Math.random() - 0.5) * 8,
    vx: (Math.random() - 0.5) * 30,
    vy: -55,
    life: 0.9, maxLife: 0.9,
    text: `${sign}${Math.round(delta)}`,
    color: '#6bc4ff',
    size: 22,
    isWorld: false,
  });
}

function recalcAuras() {
  for (const u of state.units) {
    u.bonusDamage = 0;
    u.bonusRange = 0;
    u.bonusCooldown = 0;
    u.receivedAuras = {};
  }
  if (state.showAuras) {
    for (const src of state.units) {
      if (src.isIntermediate) continue;
      const aura = AURA_EFFECTS[src.key];
      if (!aura) continue;
      for (const tgt of state.units) {
        if (tgt === src || tgt.isIntermediate) continue;
        if (Math.hypot(tgt.x - src.x, tgt.y - src.y) < WORLD.AURA_RADIUS) {
          const type = aura.type;
          if (!tgt.receivedAuras[type]) {
            tgt.receivedAuras[type] = {
              name: aura.name,
              value: aura.value,
              sources: [src.key],
            };
          } else {
            if (aura.value > tgt.receivedAuras[type].value) {
              tgt.receivedAuras[type].value = aura.value;
              tgt.receivedAuras[type].name = aura.name;
            }
            if (!tgt.receivedAuras[type].sources.includes(src.key)) {
              tgt.receivedAuras[type].sources.push(src.key);
            }
          }
        }
      }
    }
  }
  for (const u of state.units) {
    if (u.isIntermediate) { u.atk = 0; u.range = 0; u.cd = 999; continue; }
    const recv = u.receivedAuras || {};
    u.bonusDamage = recv.damage ? recv.damage.value : 0;
    u.bonusRange = recv.range ? recv.range.value : 0;
    u.bonusCooldown = recv.cooldown ? recv.cooldown.value : 0;
    u.atk   = u.baseAtk   * (1 + u.bonusDamage);
    u.range = u.baseRange * (1 + u.bonusRange);
    u.cd    = Math.max(0.15, u.baseCd * (1 + u.bonusCooldown));
  }
}

function roll() {
  if (state.gameOver || !state.running || state.paused) return;
  if (state.gold < state.rollCost) { flashMessage('金币不足', '#ff5a5a'); return; }
  state.gold -= state.rollCost;
  showGoldPopup(-state.rollCost);
  const atomKeys = Object.keys(DEFS).filter(k => DEFS[k].tier === 0);
  const key = atomKeys[Math.floor(Math.random() * atomKeys.length)];
  state.hand.push(key);
  state.rollsUsed++;
  state.rollCost = Math.min(20 + state.rollsUsed * 3, 60);
  updateHUD();
  renderHand();
}
function buyUnitLimit() {
  if (state.gameOver || !state.running || state.paused) return;
  if (state.gold < state.unitLimitCost) { flashMessage('金币不足', '#ff5a5a'); return; }
  state.gold -= state.unitLimitCost;
  showGoldPopup(-state.unitLimitCost);
  state.unitLimit += 2;
  state.unitLimitCost = Math.floor(state.unitLimitCost * 1.6);
  flashMessage(`单位上限 → ${state.unitLimit}`, '#c8b8ff');
  updateHUD();
}
function sellUnit(u) {
  if (state.paused) return;
  const def = DEFS[u.key];
  const value = 8 + u.atoms.length * 6 + (def.tier || 0) * 12;
  state.gold += value;
  removeUnit(u);
  showGoldPopup(value);
  updateHUD();
}

function sellHandCard(idx) {
  if (idx < 0 || idx >= state.hand.length) return;
  const price = SELL_HAND_PRICE;
  state.gold += price;
  showGoldPopup(price);
  state.hand.splice(idx, 1);
  state.selectedHand = -1;
  renderHand();
  updateHUD();
  if (state.dragMode) canvas.style.cursor = 'grab';
}

function update(dt) {
  state.time += dt;
  state.stageTimer += dt;
  state.spawnTimer -= dt;
  if (state.coreHitFlash > 0) state.coreHitFlash -= dt;

  if (state.stageTimer >= state.stageDuration) {
    state.stageTimer = 0;
    state.stage++;
    state.maxStage = Math.max(state.maxStage, state.stage);
    state.spawnInterval = Math.max(0.5, 2.5 - state.stage * 0.15);
    flashMessage(`阶段 ${state.stage}`, '#c8b8ff');
  }

  if (state.spawnTimer <= 0) {
    spawnEnemy();
    state.spawnTimer = state.spawnInterval * (0.8 + Math.random() * 0.4);
  }

  updateEnemies(dt);
  recalcAuras();
  updateUnits(dt);

  for (let i = state.projectiles.length - 1; i >= 0; i--) {
    state.projectiles[i].life -= dt;
    if (state.projectiles[i].life <= 0) state.projectiles.splice(i, 1);
  }
  for (let i = state.explosions.length - 1; i >= 0; i--) {
    state.explosions[i].life -= dt;
    if (state.explosions[i].life <= 0) state.explosions.splice(i, 1);
  }
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life -= dt;
    if (p.life <= 0) state.particles.splice(i, 1);
  }
  for (let i = state.popups.length - 1; i >= 0; i--) {
    const p = state.popups[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy *= 0.94;
    p.life -= dt;
    if (p.life <= 0) state.popups.splice(i, 1);
  }

  if (state.selectedEnemy && !state.enemies.includes(state.selectedEnemy)) {
    state.selectedEnemy = null;
    hideContextMenu();
  }
  if (state.selectedUnit && !state.units.includes(state.selectedUnit)) {
    state.selectedUnit = null;
    hideContextMenu();
  }

  if (state.coreHp <= 0 && !state.gameOver) {
    state.coreHp = 0;
    gameOver();
  }
}

function spawnEnemy() {
  const angle = Math.random() * Math.PI * 2;
  const x = Math.cos(angle) * WORLD.SPAWN_R;
  const y = Math.sin(angle) * WORLD.SPAWN_R;

  let type = 'basic';
  const r = Math.random();
  if (state.stage >= 3 && r < 0.30) type = 'fast';
  if (state.stage >= 5 && r > 0.78) type = 'tank';
  if (state.stage >= 8 && state.stage % 8 === 0 && Math.random() < 0.10) type = 'boss';

  const t = ENEMY_TYPES[type];
  const hpScale = 1 + (state.stage - 1) * STAGE_HP_GROWTH;
  const dmgScale = 1 + (state.stage - 1) * STAGE_DMG_GROWTH;
  const spdScale = 1 + (state.stage - 1) * STAGE_SPD_GROWTH;

  state.enemies.push({
    x, y, type,
    hp: t.hp * hpScale, maxHp: t.hp * hpScale,
    speed: t.speed * spdScale,
    damage: t.damage * dmgScale,
    radius: t.radius,
    color: t.color,
    attackInterval: t.attackInterval,
    attackTimer: 0,
    score: t.score,
    gold: t.gold,
    attacking: false,
  });
}

function updateEnemies(dt) {
  for (const e of state.enemies) {
    if (e.hp <= 0) continue;

    let target = null, minDist = Infinity;
    for (const u of state.units) {
      const d = Math.hypot(u.x - e.x, u.y - e.y);
      const rng = u.radius + e.radius + 12;
      if (d < rng && d < minDist) { minDist = d; target = u; }
    }

    if (target) {
      e.attacking = false;
      e.attackTimer -= dt;
      if (e.attackTimer <= 0) {
        e.attackTimer = e.attackInterval;
        target.hp -= e.damage;
        target.hitFlash = 0.15;
        showDamagePopup(target, e.damage);
      }
    } else {
      const d = Math.hypot(e.x, e.y);
      if (d <= WORLD.CORE_RADIUS + e.radius + 2) {
        e.attacking = true;
        e.attackTimer -= dt;
        if (e.attackTimer <= 0) {
          e.attackTimer = e.attackInterval;
          state.coreHp -= e.damage;
          state.coreHitFlash = 0.2;
          showCoreDamagePopup(e.damage);
          for (let i = 0; i < 6; i++) {
            const a = Math.random() * Math.PI * 2;
            addParticle({
              x: Math.cos(a) * WORLD.CORE_RADIUS,
              y: Math.sin(a) * WORLD.CORE_RADIUS,
              vx: Math.cos(a) * 120, vy: Math.sin(a) * 120,
              life: 0.4, maxLife: 0.4, color:'#ff5a5a', size: 4,
            });
          }
        }
      } else {
        e.attacking = false;
        e.x += (-e.x / d) * e.speed * dt;
        e.y += (-e.y / d) * e.speed * dt;
      }
    }
  }

  state.enemies = state.enemies.filter(e => {
    if (e.hp <= 0) {
      state.kills++;
      state.gold += e.gold;
      showGoldPopup(e.gold);
      const scoreGain = e.score * (1 + Math.floor((state.stage - 1) * 0.15));
      state.score += scoreGain;
      showScorePopup(scoreGain);
      for (let i = 0; i < 6; i++) {
        const a = Math.random() * Math.PI * 2;
        addParticle({
          x: e.x, y: e.y,
          vx: Math.cos(a) * 100, vy: Math.sin(a) * 100,
          life: 0.4, maxLife: 0.4, color: e.color, size: 4,
        });
      }
      return false;
    }
    return true;
  });

  state.units = state.units.filter(u => u.hp > 0);
}

function updateUnits(dt) {
  for (const u of state.units) {
    if (u.isIntermediate) continue;
    u.cdTimer -= dt;
    if (u.hitFlash > 0) u.hitFlash -= dt;

    let target = null, minDist = Infinity;
    for (const e of state.enemies) {
      const d = Math.hypot(e.x - u.x, e.y - u.y);
      if (d < u.range && d < minDist) { minDist = d; target = e; }
    }

    if (target && u.cdTimer <= 0) {
      u.cdTimer = u.cd;
      const def = DEFS[u.key];

      if (def.aoe) {
        for (const e of state.enemies) {
          if (Math.hypot(e.x - u.x, e.y - u.y) < u.range) {
            const { dmg, isCrit } = calcDamage(u.atk);
            e.hp -= dmg;
            showDamagePopup(e, dmg, { isCrit });
          }
        }
        state.explosions.push({
          x: target.x, y: target.y,
          radius: 80, maxRadius: 80, life: 0.25, maxLife: 0.25,
        });
      } else {
        const { dmg, isCrit } = calcDamage(u.atk);
        target.hp -= dmg;
        showDamagePopup(target, dmg, { isCrit });
      }

      state.projectiles.push({
        x1: u.x, y1: u.y,
        x2: target.x, y2: target.y,
        life: 0.12, maxLife: 0.12,
        color: u.color || DEFS[u.key].color,
      });
    }
  }
}

// ---------- 上下文菜单 ----------
const menuEl = document.getElementById('contextMenu');
let menuTargetRef = null;
let menuCacheKey = '';

function hideContextMenu() {
  menuEl.classList.add('hidden');
  menuTargetRef = null;
  menuCacheKey = '';
  state.selectedCore = false;
}

function hpClass(pct) {
  return pct > 0.25 ? 'hpval' : 'hpval low';
}

function collectUnitEffects(unit) {
  const effects = [];

  const elemTags = ELEMENT_TAGS[unit.key];
  if (elemTags) {
    for (const tag of elemTags) effects.push(tag);
  }

  if (AURA_EFFECTS[unit.key] && !unit.isIntermediate) {
    const my = AURA_EFFECTS[unit.key];
    effects.push({
      id: 'aura_src_' + unit.key,
      label: my.name + '源',
      category: 'aura-source',
      desc: my.desc,
    });
  }

  if (unit.receivedAuras) {
    for (const [type, info] of Object.entries(unit.receivedAuras)) {
      const sources = [...new Set(info.sources)];
      const pct = Math.round(info.value * 100);
      let effectDesc = '';
      if (type === 'damage') effectDesc = `伤害 +${pct}%`;
      else if (type === 'range') effectDesc = `射程 +${pct}%`;
      else if (type === 'cooldown') effectDesc = `冷却 ${pct}%`;
      const srcText = sources.length > 1
        ? `来源：${sources.join('、')}\n（同类效果不叠加，取最强）`
        : `来源：${sources[0]}`;
      effects.push({
        id: 'aura_recv_' + type,
        label: info.name,
        category: 'aura-target',
        desc: `${info.name}效果：${effectDesc}\n${srcText}`,
      });
    }
  }

  return effects;
}

function renderEffectTags(container, effects) {
  container.innerHTML = '';
  if (effects.length === 0) {
    container.classList.add('hidden');
    return;
  }
  container.classList.remove('hidden');
  for (const eff of effects) {
    const tag = document.createElement('span');
    tag.className = 'eff-tag cat-' + eff.category;
    tag.textContent = eff.label;
    tag.setAttribute('data-tip', eff.desc);
    container.appendChild(tag);
  }
}

function buildUnitMenu(unit) {
  const def = DEFS[unit.key];
  menuEl.querySelector('.context-title').innerHTML =
    `${def.name} <span class="sym">${def.symbol}</span>`;

  const infoEl = menuEl.querySelector('.context-info');
  const hpPct = unit.hp / unit.maxHp;
  const hpLine = `血量 <span class="${hpClass(hpPct)}">${Math.max(0, Math.ceil(unit.hp))}</span> / <span class="val">${unit.maxHp}</span>`;

  if (unit.isIntermediate) {
    infoEl.innerHTML = `过渡态 · 无法攻击 · 可继续合成\n${hpLine}`;
  } else {
    infoEl.innerHTML =
      `攻击 <span class="val">${unit.atk.toFixed(1)}</span> · 射程 <span class="val">${Math.floor(unit.range)}</span> · CD <span class="val">${unit.cd.toFixed(1)}s</span>\n` +
      hpLine;
  }

  const effectsEl = menuEl.querySelector('.context-effects');
  const effects = collectUnitEffects(unit);
  renderEffectTags(effectsEl, effects);

  const sellBtn = menuEl.querySelector('.context-btn.sell');
  sellBtn.classList.remove('hidden');
  const sellValue = 8 + unit.atoms.length * 6 + (def.tier || 0) * 12;
  sellBtn.textContent = `出售 +${sellValue} 金`;
  sellBtn.onclick = (e) => {
    e.stopPropagation();
    sellUnit(unit);
    state.selectedUnit = null;
    hideContextMenu();
  };
}

function buildEnemyMenu(enemy) {
  const t = ENEMY_TYPES[enemy.type];
  menuEl.querySelector('.context-title').innerHTML =
    `${t.name} <span class="enemy-tag">敌方</span>`;

  const infoEl = menuEl.querySelector('.context-info');
  const hpPct = enemy.hp / enemy.maxHp;
  infoEl.innerHTML =
    `攻击 <span class="val">${Math.floor(enemy.damage)}</span> · 速度 <span class="val">${Math.floor(enemy.speed)}</span> · CD <span class="val">${enemy.attackInterval.toFixed(1)}s</span>\n` +
    `血量 <span class="${hpClass(hpPct)}">${Math.max(0, Math.ceil(enemy.hp))}</span> / <span class="val">${Math.ceil(enemy.maxHp)}</span>\n` +
    `击杀奖励：分数 <span class="val">${enemy.score}</span> · 金币 <span class="val">${enemy.gold}</span>`;

  menuEl.querySelector('.context-effects').classList.add('hidden');
  menuEl.querySelector('.context-btn.sell').classList.add('hidden');
}

function buildCoreMenu() {
  menuEl.querySelector('.context-title').innerHTML =
    `反应核心 <span class="core-tag">核心</span>`;

  const infoEl = menuEl.querySelector('.context-info');
  const hpPct = state.coreHp / state.coreMaxHp;
  const coreHpCls = hpPct > 0.5 ? 'corehp' : (hpPct > 0.25 ? 'corehp' : 'corehp low');
  const m = Math.floor(state.time / 60);
  const s = Math.floor(state.time % 60);
  const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

  infoEl.innerHTML =
    `血量 <span class="${coreHpCls}">${Math.max(0, Math.ceil(state.coreHp))}</span> / <span class="val">${state.coreMaxHp}</span>\n` +
    `当前阶段 <span class="val">${state.stage}</span> · 存活 <span class="val">${timeStr}</span>\n` +
    `当前分数 <span class="val">${state.score}</span>`;

  menuEl.querySelector('.context-effects').classList.add('hidden');
  menuEl.querySelector('.context-btn.sell').classList.add('hidden');
}

function refreshMenuContent() {
  if (menuEl.classList.contains('hidden')) {
    menuTargetRef = null;
    menuCacheKey = '';
    return;
  }

  if (state.selectedCore) {
    const key = `C|${Math.ceil(state.coreHp)}|${state.stage}|${Math.floor(state.time)}|${state.score}`;
    if (menuTargetRef === 'CORE' && menuCacheKey === key) return;
    menuTargetRef = 'CORE';
    menuCacheKey = key;
    buildCoreMenu();
    return;
  }

  let target = null, isEnemy = false;
  if (state.selectedUnit && state.units.includes(state.selectedUnit)) {
    target = state.selectedUnit;
  } else if (state.selectedEnemy && state.enemies.includes(state.selectedEnemy)) {
    target = state.selectedEnemy;
    isEnemy = true;
  } else {
    hideContextMenu();
    return;
  }

  const hp = Math.max(0, Math.ceil(target.hp));
  const auraKey = target.receivedAuras
    ? Object.entries(target.receivedAuras)
        .map(([t, i]) => `${t}:${Math.round(i.value * 100)}:${i.sources.join(',')}`)
        .sort().join('|')
    : '';
  const key = isEnemy
    ? `E|${hp}|${target.attacking}`
    : `U|${hp}|${target.atk.toFixed(1)}|${Math.floor(target.range)}|${target.cd.toFixed(1)}|${auraKey}`;

  if (menuTargetRef === target && menuCacheKey === key) return;
  menuTargetRef = target;
  menuCacheKey = key;

  if (isEnemy) buildEnemyMenu(target);
  else buildUnitMenu(target);
}

function updateMenuPosition() {
  if (menuEl.classList.contains('hidden')) return;

  let targetX = 0, targetY = 0, radius = WORLD.CORE_RADIUS;
  if (state.selectedCore) {
    targetX = 0; targetY = 0; radius = WORLD.CORE_RADIUS;
  } else {
    let target = null;
    if (state.selectedUnit) target = state.selectedUnit;
    else if (state.selectedEnemy) target = state.selectedEnemy;
    if (!target) { hideContextMenu(); return; }
    targetX = target.x;
    targetY = target.y;
    radius = target.radius;
  }

  const [sx, sy] = worldToScreen(targetX, targetY);
  const menuWidth = menuEl.offsetWidth || 240;
  const menuHeight = menuEl.offsetHeight || 200;
  const screenRadius = radius * camera.zoom;
  let mx = sx + screenRadius + 14;
  let my = sy - menuHeight / 2;
  if (mx + menuWidth > window.innerWidth - 12) mx = sx - screenRadius - menuWidth - 14;
  if (mx < 12) mx = 12;
  if (my < 12) my = 12;
  if (my + menuHeight > window.innerHeight - 12) my = window.innerHeight - menuHeight - 12;
  menuEl.style.left = mx + 'px';
  menuEl.style.top = my + 'px';
}

function render() {
  ctx.fillStyle = '#07070c';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  applyCamera();

  const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, WORLD.SPAWN_R * 1.2);
  grad.addColorStop(0, 'rgba(28, 38, 68, 0.55)');
  grad.addColorStop(1, 'rgba(7, 7, 12, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(-WORLD.SPAWN_R * 1.5, -WORLD.SPAWN_R * 1.5,
               WORLD.SPAWN_R * 3, WORLD.SPAWN_R * 3);

  ctx.beginPath();
  ctx.arc(0, 0, WORLD.PLACE_MAX_R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(107, 196, 255, 0.10)';
  ctx.lineWidth = 1 / camera.zoom * 1.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, WORLD.PLACE_MIN_R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(107, 196, 255, 0.10)';
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0, 0, WORLD.SPAWN_R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255, 90, 90, 0.14)';
  ctx.lineWidth = 1 / camera.zoom * 2;
  ctx.setLineDash([20 / camera.zoom, 20 / camera.zoom]);
  ctx.stroke();
  ctx.setLineDash([]);

  if (state.showAuras) {
    for (const u of state.units) {
      if (u.isIntermediate) continue;
      if (!AURA_EFFECTS[u.key]) continue;
      ctx.beginPath();
      ctx.arc(u.x, u.y, WORLD.AURA_RADIUS, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 200, 100, 0.22)';
      ctx.lineWidth = 1 / camera.zoom * 1.5;
      ctx.setLineDash([6 / camera.zoom, 8 / camera.zoom]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    for (let i = 0; i < state.units.length; i++) {
      for (let j = i + 1; j < state.units.length; j++) {
        const a = state.units[i], b = state.units[j];
        if (a.isIntermediate || b.isIntermediate) continue;
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < WORLD.AURA_RADIUS) {
          const hasAura = AURA_EFFECTS[a.key] || AURA_EFFECTS[b.key];
          if (hasAura) {
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = 'rgba(255, 200, 100, 0.35)';
            ctx.lineWidth = 1.5 / camera.zoom * 1.5;
            ctx.setLineDash([5 / camera.zoom, 5 / camera.zoom]);
            ctx.stroke();
            ctx.setLineDash([]);
          }
        }
      }
    }
  }

  const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, WORLD.CORE_RADIUS * 2.4);
  coreGrad.addColorStop(0, 'rgba(107, 196, 255, 0.55)');
  coreGrad.addColorStop(0.5, 'rgba(107, 196, 255, 0.12)');
  coreGrad.addColorStop(1, 'rgba(107, 196, 255, 0)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(0, 0, WORLD.CORE_RADIUS * 2.4, 0, Math.PI * 2);
  ctx.fill();

  if (state.selectedCore) {
    ctx.beginPath();
    ctx.arc(0, 0, WORLD.CORE_RADIUS + 22, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 3 / camera.zoom;
    ctx.setLineDash([10 / camera.zoom, 6 / camera.zoom]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.beginPath();
  ctx.arc(0, 0, WORLD.CORE_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = state.coreHitFlash > 0 ? '#3a1a2a' : '#12182a';
  ctx.fill();
  ctx.strokeStyle = state.coreHitFlash > 0 ? '#ff5a5a' : '#6bc4ff';
  ctx.lineWidth = 2 / camera.zoom * 1.2;
  ctx.stroke();

  const hpPct = Math.max(0, state.coreHp / state.coreMaxHp);
  ctx.beginPath();
  ctx.arc(0, 0, WORLD.CORE_RADIUS + 14, -Math.PI / 2,
          -Math.PI / 2 + Math.PI * 2 * hpPct);
  ctx.strokeStyle = hpPct > 0.5 ? '#6bc4ff' : hpPct > 0.25 ? '#ffaa3a' : '#ff5a5a';
  ctx.lineWidth = 6 / camera.zoom * 1.2;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.lineCap = 'butt';

  ctx.fillStyle = state.coreHitFlash > 0 ? '#ff5a5a' : '#6bc4ff';
  ctx.font = `bold ${WORLD.CORE_RADIUS * 0.75}px system-ui`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('核', 0, 0);

  for (const u of state.units) {
    drawUnit(u, u === state.selectedUnit);
  }

  if (state.selectedHand >= 0 && state.hoveredUnit) {
    const hover = state.hoveredUnit;
    const handKey = state.hand[state.selectedHand];
    const merged = [...hover.atoms, ...DEFS[handKey].atoms].sort();
    const molKey = findMoleculeMatch(merged);
    let previewSym = null;
    if (molKey) previewSym = DEFS[molKey].symbol;
    else if (merged.length >= 2 && findSupersetMolecule(merged)) {
      previewSym = buildIntermediateSymbol(merged);
    }

    let specialReaction = null;
    for (const rx of SPECIAL_REACTIONS) {
      if ((hover.key === rx.a && handKey === rx.b) ||
          (hover.key === rx.b && handKey === rx.a)) {
        specialReaction = rx;
        break;
      }
    }
    const isSpecial = !!specialReaction;

    if (isSpecial) {
      ctx.beginPath();
      ctx.arc(hover.x, hover.y, specialReaction.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 170, 58, 0.10)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(hover.x, hover.y, specialReaction.radius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 170, 58, 0.75)';
      ctx.lineWidth = 2.5 / camera.zoom;
      ctx.setLineDash([14 / camera.zoom, 8 / camera.zoom]);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.beginPath();
      ctx.arc(hover.x, hover.y, hover.radius + 4 / camera.zoom, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 170, 58, 0.25)';
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(hover.x, hover.y, hover.radius + 14 / camera.zoom, 0, Math.PI * 2);
    ctx.strokeStyle = isSpecial ? '#ffaa3a' : (previewSym ? '#6bc4ff' : '#ff5a5a');
    ctx.lineWidth = 3 / camera.zoom;
    ctx.stroke();

    ctx.fillStyle = isSpecial ? '#ffaa3a' : (previewSym ? '#6bc4ff' : '#ff5a5a');
    ctx.font = `bold ${18 / camera.zoom}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(
      previewSym ? `→ ${previewSym}` : (isSpecial ? '→ 反应' : '不可合成'),
      hover.x, hover.y - hover.radius - 20 / camera.zoom
    );

    if (isSpecial) {
      ctx.fillStyle = 'rgba(255, 200, 100, 0.9)';
      ctx.font = `bold ${14 / camera.zoom}px system-ui`;
      ctx.fillText(
        `爆炸半径 ${specialReaction.radius}`,
        hover.x, hover.y - hover.radius - 44 / camera.zoom
      );
    }
  }

  for (const e of state.enemies) {
    drawEnemy(e, e === state.selectedEnemy);
  }

  for (const p of state.projectiles) {
    const t = p.life / p.maxLife;
    ctx.beginPath();
    ctx.moveTo(p.x1, p.y1);
    ctx.lineTo(p.x2, p.y2);
    ctx.strokeStyle = p.color;
    ctx.globalAlpha = t;
    ctx.lineWidth = 4 / camera.zoom;
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.lineCap = 'butt';

  for (const ex of state.explosions) {
    const t = 1 - ex.life / ex.maxLife;
    const r = ex.maxRadius * (0.3 + t * 0.7);
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 170, 58, ${1 - t})`;
    ctx.lineWidth = 5 / camera.zoom;
    ctx.stroke();
    const g = ctx.createRadialGradient(ex.x, ex.y, 0, ex.x, ex.y, r);
    g.addColorStop(0, `rgba(255, 210, 120, ${(1 - t) * 0.7})`);
    g.addColorStop(1, 'rgba(255, 100, 30, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  if (state.showParticles) {
    for (const p of state.particles) {
      const t = p.life / p.maxLife;
      ctx.globalAlpha = Math.min(1, t * 1.5);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(1, p.size * t), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  for (const p of state.popups) {
    if (!p.isWorld) continue;
    drawPopup(p, true);
  }

  const shouldShowPlacePreview =
    state.selectedHand >= 0 &&
    !state.hoveredUnit &&
    !dragState.overSellBtn;
  if (shouldShowPlacePreview) {
    const handKey = state.hand[state.selectedHand];
    const def = DEFS[handKey];
    const [wx, wy] = screenToWorld(state.mouseX, state.mouseY);
    const valid = tryPlace(wx, wy);
    const previewR = WORLD.TOWER_BASE_R * computeSizeFactor(def.atoms);

    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.arc(wx, wy, previewR, 0, Math.PI * 2);
    ctx.fillStyle = valid ? 'rgba(107, 196, 255, 0.35)' : 'rgba(255, 90, 90, 0.35)';
    ctx.fill();
    ctx.strokeStyle = valid ? '#6bc4ff' : '#ff5a5a';
    ctx.lineWidth = 2 / camera.zoom;
    ctx.stroke();
    if (def && def.range > 0) {
      ctx.beginPath();
      ctx.arc(wx, wy, def.range, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(107, 196, 255, 0.25)';
      ctx.lineWidth = 1 / camera.zoom;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  for (const p of state.popups) {
    if (p.isWorld) continue;
    drawPopup(p, false);
  }

  refreshMenuContent();
  updateMenuPosition();
}

function drawPopup(p, isWorld) {
  const t = p.life / p.maxLife;
  const alpha = t < 0.4 ? t / 0.4 : 1;
  ctx.globalAlpha = alpha;
  ctx.font = `800 ${p.size}px system-ui`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const lw = isWorld ? 3 / camera.zoom : 3;
  ctx.lineWidth = lw;
  ctx.strokeStyle = p.isCrit ? 'rgba(80,0,0,0.85)' : 'rgba(0,0,0,0.75)';
  ctx.strokeText(p.text, p.x, p.y);

  if (p.isCrit) {
    ctx.shadowColor = p.color;
    ctx.shadowBlur = isWorld ? 12 / camera.zoom : 12;
  }
  ctx.fillStyle = p.color;
  ctx.fillText(p.text, p.x, p.y);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

function drawUnit(u, showRange) {
  const def = DEFS[u.key];
  const r = u.radius;

  if (showRange && !u.isIntermediate && u.range > 0) {
    ctx.beginPath();
    ctx.arc(u.x, u.y, u.range, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(107, 196, 255, 0.06)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(107, 196, 255, 0.55)';
    ctx.lineWidth = 2 / camera.zoom;
    ctx.setLineDash([10 / camera.zoom, 6 / camera.zoom]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if (u.isIntermediate) {
    ctx.beginPath();
    ctx.arc(u.x, u.y + 4, r + 2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(u.x, u.y, r, 0, Math.PI * 2);
    ctx.fillStyle = def.color;
    ctx.fill();
    ctx.strokeStyle = '#a0b8d0';
    ctx.lineWidth = 3 / camera.zoom;
    ctx.setLineDash([6 / camera.zoom, 4 / camera.zoom]);
    ctx.stroke();
    ctx.setLineDash([]);

    if (u.hitFlash > 0) {
      ctx.beginPath();
      ctx.arc(u.x, u.y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${(u.hitFlash / 0.15) * 0.5})`;
      ctx.fill();
    }

    ctx.fillStyle = '#d0e0f0';
    ctx.font = `bold ${Math.max(14, r * 0.75)}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(def.symbol, u.x, u.y);

    ctx.fillStyle = '#a0b8d0';
    ctx.font = `bold ${Math.max(12, r * 0.5)}px system-ui`;
    ctx.fillText('*', u.x + r * 0.7, u.y - r * 0.7);

    drawHpArc(u, r + 14 / camera.zoom);
    return;
  }

  ctx.beginPath();
  ctx.arc(u.x, u.y + 4, r + 3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(u.x, u.y, r, 0, Math.PI * 2);
  ctx.fillStyle = def.color;
  ctx.fill();
  ctx.strokeStyle = def.stroke;
  ctx.lineWidth = 3 / camera.zoom;
  ctx.stroke();

  if (showRange) {
    ctx.beginPath();
    ctx.arc(u.x, u.y, r + 10, 0, Math.PI * 2);
    ctx.strokeStyle = '#6bc4ff';
    ctx.lineWidth = 3 / camera.zoom;
    ctx.stroke();
  }

  if (u.hitFlash > 0) {
    ctx.beginPath();
    ctx.arc(u.x, u.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${(u.hitFlash / 0.15) * 0.5})`;
    ctx.fill();
  }

  ctx.fillStyle = def.tier === 0 ? '#111' : '#fff';
  ctx.font = `bold ${Math.max(14, r * 0.85)}px system-ui`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(def.symbol, u.x, u.y);

  if (state.showAuras && AURA_EFFECTS[u.key]) {
    ctx.fillStyle = '#ffd166';
    ctx.font = `bold ${Math.max(12, r * 0.55)}px system-ui`;
    ctx.fillText('◉', u.x + r * 0.75, u.y - r * 0.75);
  }
  if (state.showAuras &&
      u.receivedAuras &&
      Object.keys(u.receivedAuras).length > 0) {
    ctx.fillStyle = '#6bc4ff';
    ctx.font = `bold ${Math.max(12, r * 0.5)}px system-ui`;
    ctx.fillText('✦', u.x + r * 0.7, u.y - r * 0.7);
  }

  drawHpArc(u, r + 14 / camera.zoom);
}

function drawHpArc(u, arcR) {
  if (u.hp >= u.maxHp) return;
  const pct = Math.max(0, Math.min(1, u.hp / u.maxHp));
  const startA = Math.PI * 0.75;
  const spanA  = Math.PI * 0.5;
  const lineW  = 7 / camera.zoom;

  ctx.beginPath();
  ctx.arc(u.x, u.y, arcR, startA, startA - spanA, true);
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
  ctx.lineWidth = lineW;
  ctx.lineCap = 'round';
  ctx.stroke();

  if (pct > 0.005) {
    const currentEnd = startA - spanA * pct;
    ctx.beginPath();
    ctx.arc(u.x, u.y, arcR, startA, currentEnd, true);
    ctx.strokeStyle = pct > 0.5 ? '#6be86b' : pct > 0.25 ? '#ffaa3a' : '#ff5a5a';
    ctx.lineWidth = lineW;
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
}

function drawEnemy(e, selected) {
  const pulse = 1 + Math.sin(state.time * 5 + e.x * 0.01) * 0.06;
  const r = e.radius * pulse;
  const pct = Math.max(0, e.hp / e.maxHp);

  ctx.beginPath();
  ctx.arc(e.x, e.y, r + 12, 0, Math.PI * 2);
  ctx.fillStyle = hexToRgba(e.color, 0.14);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
  ctx.fillStyle = hexToRgba(e.color, 0.28);
  ctx.fill();

  ctx.save();
  ctx.beginPath();
  ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
  ctx.clip();
  const fillH = r * 2 * pct;
  const fillTop = e.y + r - fillH;
  ctx.fillStyle = e.color;
  ctx.fillRect(e.x - r, fillTop, r * 2, fillH);
  if (pct > 0.02 && pct < 0.98) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.fillRect(e.x - r, fillTop, r * 2, 2 / camera.zoom);
  }
  ctx.restore();

  if (selected) {
    ctx.beginPath();
    ctx.arc(e.x, e.y, r + 10, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 3 / camera.zoom;
    ctx.setLineDash([6 / camera.zoom, 4 / camera.zoom]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.beginPath();
  ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2 / camera.zoom;
  ctx.stroke();

  if (e.attacking) {
    ctx.beginPath();
    ctx.arc(e.x, e.y, r + 6, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 90, 90, ${0.4 + Math.sin(state.time * 10) * 0.3})`;
    ctx.lineWidth = 3 / camera.zoom;
    ctx.stroke();
  }
}

function updateSellBtn() {
  const btn = document.getElementById('sellHandBtn');
  const disabled = state.gameOver || !state.running || state.paused || state.hand.length === 0;
  if (state.dragMode) {
    btn.textContent = '拖到这里卖';
    btn.title = '把手牌拖到这里卖掉';
    btn.disabled = disabled;
  } else {
    if (state.selectedHand >= 0) {
      btn.textContent = `卖掉 +${SELL_HAND_PRICE}金`;
      btn.title = '卖掉选中的手牌';
      btn.disabled = disabled;
    } else {
      btn.textContent = '卖掉';
      btn.title = '先选中一张手牌';
      btn.disabled = true;
    }
  }
  if (state.dragMode && dragState.active && !disabled) {
    btn.classList.add('btn-drop-target');
  } else {
    btn.classList.remove('btn-drop-target');
  }
}

function updateHUD() {
  document.getElementById('goldDisplay').textContent = Math.floor(state.gold);
  document.getElementById('hpDisplay').textContent = Math.max(0, Math.floor(state.coreHp));
  document.getElementById('scoreDisplay').textContent = state.score;
  document.getElementById('killDisplay').textContent = state.kills;
  const m = Math.floor(state.time / 60);
  const s = Math.floor(state.time % 60);
  document.getElementById('timeDisplay').textContent =
    `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  document.getElementById('unitDisplay').textContent =
    `${state.units.length}/${state.unitLimit}`;
  document.getElementById('stageDisplay').textContent = state.stage;
  document.getElementById('enemyDisplay').textContent = state.enemies.length;

  const rollBtn = document.getElementById('rollBtn');
  rollBtn.textContent = `抽卡 · ${state.rollCost}金`;
  rollBtn.disabled = state.gold < state.rollCost || state.gameOver || state.paused;

  const buyBtn = document.getElementById('buyLimitBtn');
  buyBtn.textContent = `增员 · ${state.unitLimitCost}金 (+2)`;
  buyBtn.disabled = state.gold < state.unitLimitCost || state.gameOver || state.paused;

  updateSellBtn();
}

function renderHand() {
  const container = document.getElementById('hand');
  container.innerHTML = '';
  for (let i = 0; i < state.hand.length; i++) {
    const key = state.hand[i];
    const def = DEFS[key];
    const slot = document.createElement('div');
    slot.className = 'hand-slot';
    if (i === state.selectedHand) slot.classList.add('selected');
    if (state.dragMode) slot.classList.add('drag-mode');
    slot.textContent = def.symbol;
    slot.style.background = def.color;
    slot.style.color = def.tier === 0 ? '#111' : '#fff';
    slot.style.textShadow = def.tier === 0 ? 'none' : '0 1px 3px rgba(0,0,0,0.6)';

    slot.addEventListener('click', (e) => {
      if (state.paused || state.gameOver || !state.running) return;
      if (state.dragMode) return;
      state.selectedHand = (state.selectedHand === i) ? -1 : i;
      if (state.selectedHand >= 0) {
        state.selectedUnit = null;
        state.selectedEnemy = null;
        state.selectedCore = false;
        hideContextMenu();
      }
      renderHand();
      updateSellBtn();
    });

    slot.addEventListener('pointerdown', (e) => {
      if (state.paused || state.gameOver || !state.running) return;
      if (!state.dragMode) return;
      if (e.button !== 0) return;
      if (activePointers.size >= 2) return;
      e.preventDefault();
      dragState.active = true;
      dragState.handIndex = i;
      dragState.startX = e.clientX;
      dragState.startY = e.clientY;
      dragState.moved = false;
      dragState.overSellBtn = false;
      state.selectedHand = i;
      state.selectedUnit = null;
      state.selectedEnemy = null;
      state.selectedCore = false;
      hideContextMenu();
      renderHand();
      updateSellBtn();
    });

    container.appendChild(slot);
  }
  updateSellBtn();
}

const sellHandBtn = document.getElementById('sellHandBtn');
sellHandBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (state.paused || state.gameOver || !state.running) return;
  if (state.dragMode) return;
  if (state.selectedHand < 0) return;
  sellHandCard(state.selectedHand);
});

document.addEventListener('pointermove', (e) => {
  if (activePointers.has(e.pointerId)) {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }
  if (pinchState.active) {
    updatePinch();
    return;
  }
  if (!dragState.active) return;
  const dx = e.clientX - dragState.startX;
  const dy = e.clientY - dragState.startY;
  if (!dragState.moved && Math.hypot(dx, dy) > 5) dragState.moved = true;

  const sellRect = sellHandBtn.getBoundingClientRect();
  const overSell = (
    e.clientX >= sellRect.left && e.clientX <= sellRect.right &&
    e.clientY >= sellRect.top && e.clientY <= sellRect.bottom
  );
  dragState.overSellBtn = overSell;
  if (overSell) {
    sellHandBtn.classList.add('btn-dragover');
  } else {
    sellHandBtn.classList.remove('btn-dragover');
  }

  const rect = canvas.getBoundingClientRect();
  state.mouseX = e.clientX - rect.left;
  state.mouseY = e.clientY - rect.top;
  if (state.mouseX >= 0 && state.mouseX <= W &&
      state.mouseY >= 0 && state.mouseY <= H &&
      !overSell) {
    const [wx, wy] = screenToWorld(state.mouseX, state.mouseY);
    state.hoveredUnit = getUnitAtWorld(wx, wy);
  } else {
    state.hoveredUnit = null;
  }
  if (!overSell) canvas.style.cursor = 'grabbing';
  else canvas.style.cursor = 'default';
});

document.addEventListener('pointerup', (e) => {
  activePointers.delete(e.pointerId);

  if (pinchState.active) {
    if (activePointers.size < 2) exitPinch();
    return;
  }

  if (!dragState.active) return;
  const moved = dragState.moved;
  const handIdx = dragState.handIndex;
  const wasOverSell = dragState.overSellBtn;
  dragState.active = false;
  dragState.handIndex = -1;
  dragState.moved = false;
  dragState.overSellBtn = false;
  sellHandBtn.classList.remove('btn-dragover');
  sellHandBtn.classList.remove('btn-drop-target');

  if (!state.running || state.gameOver || state.paused) {
    state.selectedHand = -1;
    state.hoveredUnit = null;
    renderHand();
    updateHUD();
    return;
  }

  if (wasOverSell) {
    sellHandCard(handIdx);
  } else if (moved) {
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;
    if (sx >= 0 && sx <= W && sy >= 0 && sy <= H) {
      handleDragDrop(sx, sy, handIdx);
    } else {
      state.selectedHand = -1;
      renderHand();
    }
  } else {
    state.selectedHand = -1;
    renderHand();
  }

  state.hoveredUnit = null;
  updateHUD();
  if (state.dragMode) canvas.style.cursor = 'grab';
});

document.addEventListener('pointercancel', (e) => {
  activePointers.delete(e.pointerId);
  if (pinchState.active && activePointers.size < 2) {
    exitPinch();
  }
});

function handleDragDrop(sx, sy, handIdx) {
  if (handIdx < 0 || handIdx >= state.hand.length) return;
  const handKey = state.hand[handIdx];
  const [wx, wy] = screenToWorld(sx, sy);

  const clickedUnit = getUnitAtWorld(wx, wy);
  if (clickedUnit) {
    const ok = synthesizeWithHand(clickedUnit, handKey);
    if (ok) {
      state.hand.splice(handIdx, 1);
      state.selectedHand = -1;
      renderHand();
    } else {
      state.selectedHand = -1;
      renderHand();
    }
    return;
  }
  if (tryPlace(wx, wy)) {
    placeUnit(handKey, wx, wy);
    state.hand.splice(handIdx, 1);
    state.selectedHand = -1;
    renderHand();
  } else {
    flashMessage('无法放置', '#ff5a5a');
    state.selectedHand = -1;
    renderHand();
  }
}

function enterPinch() {
  const pts = [...activePointers.values()];
  if (pts.length < 2) return;
  const p1 = pts[0], p2 = pts[1];
  const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
  const cx = (p1.x + p2.x) / 2;
  const cy = (p1.y + p2.y) / 2;
  const rect = canvas.getBoundingClientRect();
  const sx = cx - rect.left;
  const sy = cy - rect.top;
  const [wx, wy] = screenToWorld(sx, sy);

  pinchState.active = true;
  pinchState.startDist = Math.max(dist, 1);
  pinchState.startZoom = camera.zoom;
  pinchState.worldCenterX = wx;
  pinchState.worldCenterY = wy;

  pointerDown = false;
  hasDragged = false;
  activeButton = -1;

  if (dragState.active) {
    dragState.active = false;
    dragState.handIndex = -1;
    dragState.moved = false;
    dragState.overSellBtn = false;
    sellHandBtn.classList.remove('btn-dragover');
    sellHandBtn.classList.remove('btn-drop-target');
    state.selectedHand = -1;
    state.hoveredUnit = null;
    renderHand();
  }

  canvas.style.cursor = 'grabbing';
}

function updatePinch() {
  if (!pinchState.active) return;
  const pts = [...activePointers.values()];
  if (pts.length < 2) return;
  const p1 = pts[0], p2 = pts[1];
  const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
  const cx = (p1.x + p2.x) / 2;
  const cy = (p1.y + p2.y) / 2;
  const rect = canvas.getBoundingClientRect();
  const sx = cx - rect.left;
  const sy = cy - rect.top;

  const ratio = dist / pinchState.startDist;
  const newZoom = clamp(pinchState.startZoom * ratio,
                        camera.fitZoom * 0.3, camera.fitZoom * 4);
  camera.zoom = newZoom;
  camera.x = pinchState.worldCenterX - (sx - W / 2) / newZoom;
  camera.y = pinchState.worldCenterY - (sy - H / 2) / newZoom;
  updateZoomDisplay();
}

function exitPinch() {
  pinchState.active = false;
  canvas.style.cursor = 'grab';
}

const settingsOverlay = document.getElementById('settingsOverlay');

function openSettings() {
  if (state.gameOver || !state.running || state.paused) return;
  state.settingsOpen = true;
  state.paused = true;
  settingsOverlay.classList.remove('hidden');
  hideContextMenu();
  updatePauseUI();
  updateSettingsUI();
  updateSellBtn();
}

function closeSettings() {
  state.settingsOpen = false;
  state.paused = false;
  settingsOverlay.classList.add('hidden');
  updatePauseUI();
  updateSellBtn();
}

function updateSettingsUI() {
  document.querySelectorAll('.setting-seg').forEach(seg => {
    const setting = seg.dataset.setting;
    let currentValue = null;
    if (setting === 'mode') currentValue = state.dragMode ? 'drag' : 'click';
    else if (setting === 'auras') currentValue = state.showAuras ? 'on' : 'off';
    else if (setting === 'damage') currentValue = state.showDamagePopups ? 'on' : 'off';
    else if (setting === 'particles') currentValue = state.showParticles ? 'on' : 'off';
    seg.querySelectorAll('.seg-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.value === currentValue);
    });
  });
}

document.querySelectorAll('.setting-seg .seg-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const setting = btn.parentElement.dataset.setting;
    const value = btn.dataset.value;
    if (setting === 'mode') {
      state.dragMode = value === 'drag';
      state.selectedHand = -1;
      dragState.active = false;
      dragState.handIndex = -1;
      dragState.moved = false;
      dragState.overSellBtn = false;
      sellHandBtn.classList.remove('btn-dragover');
      sellHandBtn.classList.remove('btn-drop-target');
      renderHand();
    } else if (setting === 'auras') {
      state.showAuras = value === 'on';
    } else if (setting === 'damage') {
      state.showDamagePopups = value === 'on';
    } else if (setting === 'particles') {
      state.showParticles = value === 'on';
      if (!state.showParticles) state.particles.length = 0;
    }
    updateSettingsUI();
    updateSellBtn();
  });
});

document.getElementById('settingsBtn').onclick = openSettings;
document.getElementById('settingsCloseBtn').onclick = closeSettings;
settingsOverlay.addEventListener('click', (e) => {
  if (e.target === settingsOverlay) closeSettings();
});

function gameOver() {
  state.gameOver = true;
  state.running = false;
  state.paused = false;
  state.settingsOpen = false;
  settingsOverlay.classList.add('hidden');
  updatePauseUI();
  hideContextMenu();
  toastContainer.innerHTML = '';
  const m = Math.floor(state.time / 60);
  const s = Math.floor(state.time % 60);
  document.getElementById('finalScore').textContent = state.score;
  document.getElementById('finalTime').textContent =
    `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  document.getElementById('finalKills').textContent = state.kills;
  document.getElementById('finalStage').textContent = state.maxStage;
  document.getElementById('gameOver').classList.remove('hidden');
  document.querySelector('.panel').style.display = 'none';
  document.querySelector('.view-controls').style.display = 'none';
}

let pointerDown = false;
let pointerStartX = 0, pointerStartY = 0;
let panStartCamX = 0, panStartCamY = 0;
let hasDragged = false;
let activeButton = -1;

canvas.addEventListener('pointerdown', (e) => {
  if (state.paused || state.gameOver || !state.running) return;
  if (dragState.active) return;

  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (activePointers.size === 2) {
    enterPinch();
    return;
  }
  if (activePointers.size > 2) return;

  if (e.button === 1) e.preventDefault();
  pointerDown = true;
  activeButton = e.button;
  pointerStartX = e.clientX;
  pointerStartY = e.clientY;
  panStartCamX = camera.x;
  panStartCamY = camera.y;
  hasDragged = false;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});

canvas.addEventListener('pointermove', (e) => {
  if (activePointers.has(e.pointerId)) {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }
  if (pinchState.active) {
    updatePinch();
    return;
  }
  if (dragState.active) return;
  const rect = canvas.getBoundingClientRect();
  state.mouseX = e.clientX - rect.left;
  state.mouseY = e.clientY - rect.top;

  if (pointerDown && !state.paused) {
    const dx = e.clientX - pointerStartX;
    const dy = e.clientY - pointerStartY;
    if (!hasDragged && Math.hypot(dx, dy) > 5) hasDragged = true;
    if (hasDragged) {
      camera.x = panStartCamX - dx / camera.zoom;
      camera.y = panStartCamY - dy / camera.zoom;
      hideContextMenu();
      state.selectedUnit = null;
      state.selectedEnemy = null;
      state.selectedCore = false;
    }
  }

  const [wx, wy] = screenToWorld(state.mouseX, state.mouseY);
  state.hoveredUnit = getUnitAtWorld(wx, wy);

  if (state.paused || state.gameOver || !state.running) {
    canvas.style.cursor = 'default';
    return;
  }
  if (hasDragged) canvas.style.cursor = 'grabbing';
  else if (state.selectedHand >= 0) canvas.style.cursor = 'crosshair';
  else if (state.hoveredUnit) canvas.style.cursor = 'pointer';
  else {
    const hoverE = getEnemyAtWorld(wx, wy);
    const hoverCore = !hoverE && getCoreAtWorld(wx, wy);
    canvas.style.cursor = (hoverE || hoverCore) ? 'pointer' : 'grab';
  }
});

canvas.addEventListener('pointerup', (e) => {
  activePointers.delete(e.pointerId);

  if (pinchState.active) {
    if (activePointers.size < 2) exitPinch();
    return;
  }

  if (dragState.active) return;
  if (!pointerDown) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  if (!hasDragged && !state.paused) handleClick(x, y, activeButton);
  pointerDown = false;
  hasDragged = false;
  activeButton = -1;
  try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
});

canvas.addEventListener('pointercancel', (e) => {
  activePointers.delete(e.pointerId);
  if (pinchState.active && activePointers.size < 2) {
    exitPinch();
  }
  pointerDown = false;
  hasDragged = false;
  activeButton = -1;
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (state.paused || state.gameOver || !state.running) return;
  if (pinchState.active) return;
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;

  const before = screenToWorld(sx, sy);
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  camera.zoom = clamp(camera.zoom * factor,
                      camera.fitZoom * 0.3,
                      camera.fitZoom * 4);
  const after = screenToWorld(sx, sy);
  camera.x += before[0] - after[0];
  camera.y += before[1] - after[1];
  updateZoomDisplay();
}, { passive: false });

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function handleClick(sx, sy, button) {
  if (!state.running || state.gameOver || state.paused) return;
  const [wx, wy] = screenToWorld(sx, sy);
  const clickedUnit = getUnitAtWorld(wx, wy);
  const clickedCore = !clickedUnit && getCoreAtWorld(wx, wy);
  const clickedEnemy = (!clickedUnit && !clickedCore) ? getEnemyAtWorld(wx, wy) : null;

  if (button === 2) {
    if (clickedUnit) {
      sellUnit(clickedUnit);
      state.selectedUnit = null;
      state.selectedEnemy = null;
      state.selectedCore = false;
      hideContextMenu();
    }
    return;
  }
  if (button !== 0) return;

  if (state.selectedHand >= 0) {
    const handKey = state.hand[state.selectedHand];
    if (clickedUnit) {
      const ok = synthesizeWithHand(clickedUnit, handKey);
      if (ok) {
        state.hand.splice(state.selectedHand, 1);
        state.selectedHand = -1;
        renderHand();
        updateHUD();
      } else {
        state.selectedHand = -1;
        renderHand();
        updateHUD();
      }
      return;
    }
    if (tryPlace(wx, wy)) {
      placeUnit(handKey, wx, wy);
      state.hand.splice(state.selectedHand, 1);
      state.selectedHand = -1;
      renderHand();
      updateHUD();
    } else {
      flashMessage('无法放置', '#ff5a5a');
      state.selectedHand = -1;
      renderHand();
      updateHUD();
    }
    return;
  }

  if (clickedUnit) {
    if (state.selectedUnit === clickedUnit) {
      state.selectedUnit = null;
      hideContextMenu();
    } else {
      state.selectedUnit = clickedUnit;
      state.selectedEnemy = null;
      state.selectedCore = false;
      menuTargetRef = null;
      menuCacheKey = '';
      buildUnitMenu(clickedUnit);
      menuEl.classList.remove('hidden');
      updateMenuPosition();
    }
    return;
  }

  if (clickedCore) {
    if (state.selectedCore) {
      state.selectedCore = false;
      hideContextMenu();
    } else {
      state.selectedUnit = null;
      state.selectedEnemy = null;
      state.selectedCore = true;
      menuTargetRef = null;
      menuCacheKey = '';
      buildCoreMenu();
      menuEl.classList.remove('hidden');
      updateMenuPosition();
    }
    return;
  }

  if (clickedEnemy) {
    if (state.selectedEnemy === clickedEnemy) {
      state.selectedEnemy = null;
      hideContextMenu();
    } else {
      state.selectedUnit = null;
      state.selectedCore = false;
      state.selectedEnemy = clickedEnemy;
      menuTargetRef = null;
      menuCacheKey = '';
      buildEnemyMenu(clickedEnemy);
      menuEl.classList.remove('hidden');
      updateMenuPosition();
    }
    return;
  }

  state.selectedUnit = null;
  state.selectedEnemy = null;
  state.selectedCore = false;
  hideContextMenu();
}

document.getElementById('rollBtn').onclick = roll;
document.getElementById('buyLimitBtn').onclick = buyUnitLimit;
document.getElementById('restartBtn').onclick = reset;
document.getElementById('zoomInBtn').onclick = () => {
  if (state.paused) return;
  camera.zoom = clamp(camera.zoom * 1.25, camera.fitZoom * 0.3, camera.fitZoom * 4);
  updateZoomDisplay();
};
document.getElementById('zoomOutBtn').onclick = () => {
  if (state.paused) return;
  camera.zoom = clamp(camera.zoom / 1.25, camera.fitZoom * 0.3, camera.fitZoom * 4);
  updateZoomDisplay();
};
document.getElementById('resetViewBtn').onclick = () => {
  if (state.paused) return;
  resetCamera();
};

function togglePause() {
  if (state.gameOver || !state.running) return;
  if (state.settingsOpen) return;
  state.paused = !state.paused;
  updatePauseUI();
  updateSellBtn();
}

function cycleSpeed() {
  if (state.paused) return;
  const speeds = [1, 2, 4];
  const idx = speeds.indexOf(state.speedMultiplier);
  state.speedMultiplier = speeds[(idx + 1) % speeds.length];
  updateSpeedUI();
}

function setSpeed(v) {
  if (state.paused) return;
  state.speedMultiplier = v;
  updateSpeedUI();
}

function updatePauseUI() {
  const overlay = document.getElementById('pauseOverlay');
  const btn = document.getElementById('pauseBtn');
  const showPauseOverlay = state.paused && !state.settingsOpen;
  if (showPauseOverlay) {
    overlay.classList.remove('hidden');
  } else {
    overlay.classList.add('hidden');
  }
  if (state.paused) {
    btn.textContent = '▶';
    btn.title = '继续 (空格)';
    btn.classList.add('active');
    hideContextMenu();
  } else {
    btn.textContent = '⏸';
    btn.title = '暂停 (空格)';
    btn.classList.remove('active');
  }
}

function updateSpeedUI() {
  const btn = document.getElementById('speedBtn');
  btn.textContent = '×' + state.speedMultiplier;
  if (state.speedMultiplier > 1) btn.classList.add('active');
  else btn.classList.remove('active');
}

document.getElementById('pauseBtn').onclick = togglePause;
document.getElementById('speedBtn').onclick = cycleSpeed;

document.getElementById('pauseOverlay').addEventListener('click', (e) => {
  e.stopPropagation();
  togglePause();
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (state.settingsOpen) {
    if (e.code === 'Escape') {
      e.preventDefault();
      closeSettings();
    }
    return;
  }

  if (e.code === 'Space') {
    e.preventDefault();
    togglePause();
    return;
  }

  if (state.paused) return;

  if (e.code === 'Digit1') setSpeed(1);
  else if (e.code === 'Digit2') setSpeed(2);
  else if (e.code === 'Digit3') setSpeed(4);
});

document.addEventListener('click', (e) => {
  if (menuEl.classList.contains('hidden')) return;
  if (menuEl.contains(e.target)) return;
  if (e.target === canvas) return;
  state.selectedUnit = null;
  state.selectedEnemy = null;
  state.selectedCore = false;
  hideContextMenu();
});

function reset() {
  for (const key in DEFS) {
    if (DEFS[key].isIntermediate) delete DEFS[key];
  }
  state.gold = 200;
  state.coreHp = CORE_MAX_HP;
  state.coreMaxHp = CORE_MAX_HP;
  state.units = [];
  state.enemies = [];
  state.projectiles = [];
  state.explosions = [];
  state.particles = [];
  state.popups = [];
  state.hand = ['H', 'O', 'C'];
  state.selectedHand = -1;
  state.selectedUnit = null;
  state.selectedEnemy = null;
  state.selectedCore = false;
  state.hoveredUnit = null;
  state.time = 0;
  state.running = true;
  state.gameOver = false;
  state.paused = false;
  state.speedMultiplier = 1;
  state.spawnTimer = 2;
  state.spawnInterval = 2.5;
  state.stage = 1;
  state.maxStage = 1;
  state.stageTimer = 0;
  state.kills = 0;
  state.score = 0;
  state.rollCost = 20;
  state.rollsUsed = 0;
  state.unitLimit = START_UNIT_LIMIT;
  state.unitLimitCost = 60;
  state.coreHitFlash = 0;
  state.dragMode = false;
  state.showAuras = true;
  state.showDamagePopups = true;
  state.showParticles = true;
  state.settingsOpen = false;
  dragState.active = false;
  dragState.handIndex = -1;
  dragState.moved = false;
  dragState.overSellBtn = false;
  activePointers.clear();
  pinchState.active = false;
  sellHandBtn.classList.remove('btn-dragover');
  sellHandBtn.classList.remove('btn-drop-target');
  settingsOverlay.classList.add('hidden');
  toastContainer.innerHTML = '';
  hideContextMenu();
  resetCamera();
  updatePauseUI();
  updateSpeedUI();
  updateSettingsUI();
  document.getElementById('gameOver').classList.add('hidden');
  document.querySelector('.panel').style.display = 'flex';
  document.querySelector('.view-controls').style.display = 'flex';
  updateHUD();
  renderHand();
}

const MAX_STEP = 1 / 60;
function stepUpdate(totalDt) {
  let remaining = totalDt;
  let safety = 0;
  while (remaining > 0.0001 && safety < 30) {
    const step = Math.min(remaining, MAX_STEP);
    update(step);
    remaining -= step;
    safety++;
  }
}

let lastTime = 0;
function loop(now) {
  if (!lastTime) lastTime = now;
  const realDt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (state.running && !state.gameOver && !state.paused) {
    stepUpdate(realDt * state.speedMultiplier);
    updateHUD();
  }
  render();
  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(loop);
</script>
</body>
