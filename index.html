<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#07070c">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>原子序塔防2 — 原型 v0.67</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="hud-row gold"><span>金币</span><span class="hud-val" id="goldDisplay">200</span></div>
  <div class="hud-row hp"><span>核心</span><span class="hud-val" id="hpDisplay">10000</span></div>
  <div class="hud-row units"><span>单位</span><span class="hud-val" id="unitDisplay">0/12</span></div>
</div>

<div class="score-panel">
  <div class="score-label">分数</div>
  <div class="score-value" id="scoreDisplay">0</div>
  <div class="score-sub">击杀 <span id="killDisplay">0</span> · 存活 <span id="timeDisplay">00:00</span></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="hud-right">
  <div class="hud-row"><span>阶段</span><span class="hud-val" id="stageDisplay">1</span></div>
  <div class="hud-row"><span>敌人</span><span class="hud-val" id="enemyDisplay">0</span></div>
  <div class="hud-row"><span>缩放</span><span class="hud-val" id="zoomDisplay">100%</span></div>
</div>

<div class="action-bar">
  <button class="btn btn-roll" id="rollBtn">抽卡 · 20金</button>
  <button class="btn btn-buy" id="buyLimitBtn">增员 · 60金</button>
</div>

<div class="panel">
  <div class="panel-label">背包</div>
  <button class="sell-slot" id="sellHandBtn">卖</button>
  <div class="hand-scroll"><div class="hand" id="hand"></div></div>
</div>

<div class="view-controls">
  <button class="view-btn" id="pauseBtn">⏸</button>
  <button class="view-btn" id="speedBtn">×1</button>
  <button class="view-btn" id="settingsBtn">⚙</button>
  <button class="view-btn" id="zoomInBtn">+</button>
  <button class="view-btn" id="zoomOutBtn">−</button>
  <button class="view-btn" id="resetViewBtn">⌖</button>
</div>

<div class="roll-overlay hidden" id="rollOverlay">
  <div class="roll-box" id="rollBox">
    <div class="roll-spark"></div>
    <div class="roll-symbol" id="rollSymbol">?</div>
    <div class="roll-label" id="rollLabel">抽取中...</div>
  </div>
</div>

<div class="pause-overlay hidden" id="pauseOverlay">
  <div class="pause-text">已暂停</div>
  <div class="pause-hint">点击任意处继续</div>
</div>

<div class="settings-overlay hidden" id="settingsOverlay">
  <div class="settings-panel">
    <div class="settings-header">
      <span class="settings-title">设置</span>
      <button class="settings-close" id="settingsCloseBtn">×</button>
    </div>
    <div class="settings-body">
      <div class="setting-item">
        <div class="setting-label">
          <div class="setting-name">放置模式</div>
          <div class="setting-desc">点击：选牌后点地图；拖拽：按住牌拖到地图</div>
        </div>
        <div class="setting-seg" data-setting="mode">
          <button class="seg-btn" data-value="click">点击</button>
          <button class="seg-btn" data-value="drag">拖拽</button>
        </div>
      </div>
      <div class="setting-item">
        <div class="setting-label">
          <div class="setting-name">抽取动画</div>
          <div class="setting-desc">瞬间抽取会跳过动画，且不暂停游戏</div>
        </div>
        <div class="setting-seg" data-setting="speedroll">
          <button class="seg-btn" data-value="normal">普通</button>
          <button class="seg-btn" data-value="fast">快速</button>
          <button class="seg-btn" data-value="instant">瞬间</button>
        </div>
      </div>
      <div class="setting-item">
        <div class="setting-label">
          <div class="setting-name">光环显示</div>
          <div class="setting-desc">显示塔与塔之间的光环圈和连线</div>
        </div>
        <div class="setting-seg" data-setting="auras">
          <button class="seg-btn" data-value="on">开</button>
          <button class="seg-btn" data-value="off">关</button>
        </div>
      </div>
      <div class="setting-item">
        <div class="setting-label">
          <div class="setting-name">伤害数字</div>
          <div class="setting-desc">显示攻击和反应造成的伤害数字</div>
        </div>
        <div class="setting-seg" data-setting="damage">
          <button class="seg-btn" data-value="on">开</button>
          <button class="seg-btn" data-value="off">关</button>
        </div>
      </div>
      <div class="setting-item">
        <div class="setting-label">
          <div class="setting-name">粒子效果</div>
          <div class="setting-desc">显示爆炸、打击时的粒子特效</div>
        </div>
        <div class="setting-seg" data-setting="particles">
          <button class="seg-btn" data-value="on">开</button>
          <button class="seg-btn" data-value="off">关</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="contextMenu" class="context-menu hidden">
  <div class="context-title"></div>
  <div class="context-info"></div>
  <div class="context-effects hidden"></div>
  <button class="context-btn sell">出售</button>
</div>

<div class="overlay hidden" id="gameOver">
  <h1>核心被摧毁</h1>
  <div class="sub">最终分数</div>
  <div class="big" id="finalScore">0</div>
  <div class="stat">存活时间 <span id="finalTime">00:00</span></div>
  <div class="stat">击杀数 <span id="finalKills">0</span></div>
  <div class="stat">最高阶段 <span id="finalStage">1</span></div>
  <button class="btn" id="restartBtn" style="margin-top:26px;">重新开始</button>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/camera.js"></script>
<script src="js/effects.js"></script>
<script src="js/entities.js"></script>
<script src="js/ui.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
