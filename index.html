<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原子序塔防2 — 原型 v0.17</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#07070c;
    color:#e8e8f0; font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif; }
  canvas { display:block; position:fixed; inset:0; touch-action:none; }

  .hud { position:fixed; top:16px; left:22px; z-index:10; pointer-events:none; }
  .hud-row { display:flex; gap:10px; align-items:baseline; margin-bottom:4px; font-size:12px; color:#778; letter-spacing:1px; }
  .hud-val { color:#e8e8f0; font-weight:700; font-size:18px; font-variant-numeric:tabular-nums; }
  .gold .hud-val { color:#ffd166; }
  .hp .hud-val { color:#ff6b6b; }
  .units .hud-val { color:#c8b8ff; }

  .score-panel { position:fixed; top:14px; left:50%; transform:translateX(-50%);
    z-index:10; text-align:center; pointer-events:none; }
  .score-label { font-size:11px; color:#667; letter-spacing:4px; margin-bottom:2px; }
  .score-value { font-size:44px; font-weight:800; color:#6bc4ff;
    font-variant-numeric:tabular-nums; letter-spacing:2px;
    text-shadow:0 0 24px rgba(107,196,255,0.55); line-height:1; }
  .score-sub { font-size:12px; color:#889; letter-spacing:1px; margin-top:4px; }

  .toast-container { position:fixed; top:126px; left:50%; transform:translateX(-50%);
    z-index:20; display:flex; flex-direction:column; align-items:center;
    gap:6px; pointer-events:none; }
  .toast { padding:8px 22px; border-radius:999px;
    background:rgba(10,14,24,0.9);
    border:2px solid; font-weight:800; font-size:20px;
    letter-spacing:1px; white-space:nowrap;
    animation: toastIn 0.25s ease-out, toastOut 0.5s ease-in 1.4s forwards; }
  @keyframes toastIn {
    from { opacity:0; transform:translateY(-14px) scale(0.9); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes toastOut {
    to { opacity:0; transform:translateY(-20px); }
  }

  .hud-right { position:fixed; top:16px; right:22px; z-index:10; text-align:right; }
  .hud-right .hud-row { justify-content:flex-end; }

  .panel { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:10;
    display:flex; gap:10px; align-items:center; background:rgba(14,16,26,0.9);
    backdrop-filter:blur(16px); border:1px solid #252a3e; border-radius:16px;
    padding:10px 14px; box-shadow:0 8px 40px rgba(0,0,0,0.65); max-width:96vw;
    height:88px; }
  .panel-label { font-size:10px; color:#667; letter-spacing:2px; writing-mode:vertical-rl;
    text-orientation:mixed; padding:2px 0; flex-shrink:0; }

  .hand-scroll { overflow-x:auto; overflow-y:hidden; max-width:52vw;
    padding:2px 2px 6px 2px; height:68px; flex-shrink:0; }
  .hand-scroll::-webkit-scrollbar { height:6px; }
  .hand-scroll::-webkit-scrollbar-thumb { background:#252a3e; border-radius:3px; }
  .hand-scroll::-webkit-scrollbar-thumb:hover { background:#3a4055; }
  .hand { display:flex; gap:8px; height:100%; align-items:center; }

  .hand-slot { width:52px; height:52px; border-radius:10px; display:flex;
    align-items:center; justify-content:center; font-weight:800; font-size:17px;
    border:2px solid transparent; cursor:pointer; transition:all 0.12s;
    position:relative; flex-shrink:0; }
  .hand-slot:hover { transform:translateY(-3px); filter:brightness(1.15); }
  .hand-slot.selected { border-color:#6bc4ff; box-shadow:0 0 16px rgba(107,196,255,0.75); transform:translateY(-4px); }

  .btn { padding:10px 18px; border-radius:10px; border:none;
    background:linear-gradient(135deg,#3a7bd5,#2a5fa5); color:#fff;
    font-weight:700; font-size:13px; cursor:pointer; transition:all 0.12s;
    font-family:inherit; letter-spacing:1px; flex-shrink:0; white-space:nowrap; }
  .btn:not(:disabled):hover { background:linear-gradient(135deg,#4a8be5,#3a6fb5); transform:translateY(-1px); }
  .btn:not(:disabled):active { transform:translateY(0); }
  .btn:disabled { background:#1c2030; color:#445; cursor:not-allowed; transform:none; box-shadow:none; }

  .btn-roll { background:linear-gradient(135deg,#f0932b,#d97e1a); }
  .btn-roll:not(:disabled):hover { background:linear-gradient(135deg,#ffa33b,#e98e2a); }
  .btn-buy { background:linear-gradient(135deg,#8a5cd0,#6a3fa8); }
  .btn-buy:not(:disabled):hover { background:linear-gradient(135deg,#9a6ce0,#7a4fb8); }

  .view-controls { position:fixed; right:22px; bottom:130px; z-index:11;
    display:flex; flex-direction:column; gap:8px; }
  .view-btn { width:42px; height:42px; border-radius:10px; border:1px solid #2e3550;
    background:rgba(14,16,26,0.9); color:#889; cursor:pointer;
    font-size:16px; font-weight:700; transition:all 0.12s;
    display:flex; align-items:center; justify-content:center; font-family:inherit; }
  .view-btn:hover { background:rgba(30,36,54,0.95); color:#6bc4ff; border-color:#6bc4ff; }
  .view-btn:active { transform:scale(0.94); }
  .view-btn.active { background:rgba(60,90,150,0.95); color:#6bc4ff; border-color:#6bc4ff;
    box-shadow:0 0 12px rgba(107,196,255,0.4); }

  .pause-overlay { position:fixed; inset:0; z-index:90;
    background:rgba(7,7,12,0.6); backdrop-filter:blur(4px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:auto; cursor:pointer;
    animation:fadeIn 0.15s ease-out;
    -webkit-tap-highlight-color: transparent; }
  @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
  .pause-text { font-size:64px; font-weight:800; color:#6bc4ff;
    letter-spacing:12px; text-shadow:0 0 40px rgba(107,196,255,0.7); pointer-events:none; }
  .pause-hint { font-size:15px; color:#9aa; letter-spacing:4px; margin-top:18px;
    pointer-events:none;
    animation: pauseBlink 1.6s ease-in-out infinite; }
  @keyframes pauseBlink { 0%,100% { opacity:0.6 } 50% { opacity:1 } }

  .context-menu { position:fixed; z-index:200;
    background:rgba(18,22,34,0.96); backdrop-filter:blur(14px);
    border:1px solid #2e3550; border-radius:12px;
    padding:12px 14px; min-width:220px; max-width:280px;
    box-shadow:0 8px 32px rgba(0,0,0,0.7);
    font-size:13px; line-height:1.55;
    animation:menuIn 0.12s ease-out;
    pointer-events:none; }
  @keyframes menuIn {
    from { opacity:0; transform:scale(0.92); }
    to { opacity:1; transform:scale(1); }
  }
  .context-menu .context-btn { pointer-events:auto; }
  .context-title { font-weight:800; font-size:15px; color:#e8e8f0; margin-bottom:6px;
    border-bottom:1px solid #2e3550; padding-bottom:6px; }
  .context-title .sym { color:#6bc4ff; }
  .context-title .enemy-tag { color:#ff5a5a; font-size:11px; font-weight:600;
    letter-spacing:1px; margin-left:6px; padding:1px 6px;
    background:rgba(255,90,90,0.15); border-radius:4px; }
  .context-title .core-tag { color:#6bc4ff; font-size:11px; font-weight:600;
    letter-spacing:1px; margin-left:6px; padding:1px 6px;
    background:rgba(107,196,255,0.15); border-radius:4px; }
  .context-info { color:#9aa3b8; font-size:12px; margin-bottom:6px; letter-spacing:0.5px;
    white-space:pre-line; }
  .context-info .val { color:#e8e8f0; font-weight:700; }
  .context-info .hpval { color:#6be86b; font-weight:700; }
  .context-info .hpval.low { color:#ff5a5a; }
  .context-info .corehp { color:#6bc4ff; font-weight:700; }
  .context-info .corehp.low { color:#ff5a5a; }
  .context-aura { color:#ffd166; font-size:12px; margin-bottom:6px; white-space:pre-line;
    padding:5px 7px; background:rgba(255,209,102,0.08); border-radius:5px;
    border-left:2px solid #ffd166; }
  .context-aura.hidden { display:none; }
  .context-btn { width:100%; padding:8px; border-radius:8px; border:none;
    font-family:inherit; font-weight:700; font-size:13px; cursor:pointer;
    transition:all 0.12s; letter-spacing:1px; }
  .context-btn.sell { background:linear-gradient(135deg,#c84848,#a03030); color:#fff; }
  .context-btn.sell:hover { background:linear-gradient(135deg,#d85858,#b04040); }
  .context-btn.sell:active { transform:scale(0.98); }
  .context-btn.hidden { display:none; }

  .overlay { position:fixed; inset:0; background:rgba(6,6,12,0.9);
    backdrop-filter:blur(12px); display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:100; }
  .overlay h1 { font-size:36px; margin-bottom:6px; color:#ff5a5a; letter-spacing:4px; }
  .overlay .sub { color:#778; font-size:13px; letter-spacing:3px; margin-bottom:4px; }
  .overlay .big { font-size:64px; color:#6bc4ff; font-weight:800;
    font-variant-numeric:tabular-nums; margin-bottom:18px; letter-spacing:2px;
    text-shadow:0 0 40px rgba(107,196,255,0.5); }
  .overlay .stat { color:#aab; font-size:15px; margin-bottom:4px; letter-spacing:1px; }
  .overlay .stat span { color:#e8e8f0; font-weight:700; font-variant-numeric:tabular-nums; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="hud-row gold"><span>金币</span><span class="hud-val" id="goldDisplay">200</span></div>
  <div class="hud-row hp"><span>核心</span><span class="hud-val" id="hpDisplay">10000</span></div>
  <div class="hud-row units"><span>单位</span><span class="hud-val" id="unitDisplay">0/12</span></div>
</div>

<div class="score-panel">
  <div class="score-label">分数</div>
  <div class="score-value" id="scoreDisplay">0</div>
  <div class="score-sub">击杀 <span id="killDisplay">0</span> · 存活 <span id="timeDisplay">00:00</span></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="hud-right">
  <div class="hud-row"><span>阶段</span><span class="hud-val" id="stageDisplay">1</span></div>
  <div class="hud-row"><span>敌人</span><span class="hud-val" id="enemyDisplay">0</span></div>
  <div class="hud-row"><span>缩放</span><span class="hud-val" id="zoomDisplay">100%</span></div>
</div>

<div class="panel">
  <div class="panel-label">背包</div>
  <div class="hand-scroll"><div class="hand" id="hand"></div></div>
  <button class="btn btn-roll" id="rollBtn">抽卡 · 20金</button>
  <button class="btn btn-buy" id="buyLimitBtn">扩容 · 60金 (+2)</button>
</div>

<div class="view-controls">
  <button class="view-btn" id="pauseBtn" title="暂停 (空格)">⏸</button>
  <button class="view-btn" id="speedBtn" title="切换速度 (1/2/3)">×1</button>
  <button class="view-btn" id="zoomInBtn" title="放大">+</button>
  <button class="view-btn" id="zoomOutBtn" title="缩小">−</button>
  <button class="view-btn" id="resetViewBtn" title="重置视角">⌖</button>
</div>

<div class="pause-overlay hidden" id="pauseOverlay">
  <div class="pause-text">已暂停</div>
  <div class="pause-hint">点击任意处继续</div>
</div>

<div id="contextMenu" class="context-menu hidden">
  <div class="context-title"></div>
  <div class="context-info"></div>
  <div class="context-aura hidden"></div>
  <button class="context-btn sell">出售</button>
</div>

<div class="overlay hidden" id="gameOver">
  <h1>核心被摧毁</h1>
  <div class="sub">最终分数</div>
  <div class="big" id="finalScore">0</div>
  <div class="stat">存活时间 <span id="finalTime">00:00</span></div>
  <div class="stat">击杀数 <span id="finalKills">0</span></div>
  <div class="stat">最高阶段 <span id="finalStage">1</span></div>
  <button class="btn" id="restartBtn" style="margin-top:26px;">重新开始</button>
</div>

<script>
// ============================================================
// 原子序塔防2 — 原型 v0.17
// 核心可点击查看 | 数值平衡调整
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

const WORLD = {
  CORE_RADIUS: 70,
  PLACE_MIN_R: 150,
  PLACE_MAX_R: 820,
  SPAWN_R: 920,
  TOWER_BASE_R: 50,
  AURA_RADIUS: 140,
};

const camera = { x: 0, y: 0, zoom: 1, fitZoom: 1, initialized: false };

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function computeFitZoom() { return (Math.min(W, H) * 0.4) / WORLD.PLACE_MAX_R; }

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  camera.fitZoom = computeFitZoom();
  if (!camera.initialized) {
    camera.x = 0; camera.y = 0;
    camera.zoom = camera.fitZoom;
    camera.initialized = true;
  } else {
    camera.zoom = clamp(camera.zoom, camera.fitZoom * 0.3, camera.fitZoom * 4);
  }
  updateZoomDisplay();
}
window.addEventListener('resize', resize);
resize();

function screenToWorld(sx, sy) {
  return [(sx - W / 2) / camera.zoom + camera.x, (sy - H / 2) / camera.zoom + camera.y];
}
function worldToScreen(wx, wy) {
  return [(wx - camera.x) * camera.zoom + W / 2, (wy - camera.y) * camera.zoom + H / 2];
}
function applyCamera() {
  ctx.translate(W / 2, H / 2);
  ctx.scale(camera.zoom, camera.zoom);
  ctx.translate(-camera.x, -camera.y);
}
function updateZoomDisplay() {
  const el = document.getElementById('zoomDisplay');
  if (el) el.textContent = Math.round((camera.zoom / camera.fitZoom) * 100) + '%';
}
function resetCamera() {
  camera.x = 0; camera.y = 0;
  camera.zoom = camera.fitZoom;
  updateZoomDisplay();
}

function hexToRgba(hex, alpha) {
  if (!hex || hex[0] !== '#') return hex;
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ============================================================
// ★ 数值平衡调整（集中在这里，方便调）
// ============================================================
const ENABLE_AURAS = true;
const HP_SCALE = 20;
const CORE_MAX_HP = 10000;        // 1000 → 10000
const START_UNIT_LIMIT = 12;

const CRIT_CHANCE = 0.10;
const CRIT_MULT = 2.0;
function calcDamage(baseAtk) {
  const isCrit = Math.random() < CRIT_CHANCE;
  return { dmg: isCrit ? baseAtk * CRIT_MULT : baseAtk, isCrit };
}

const ATOM_MASS = { H:1, O:16, Na:23, Cl:35.5, C:12 };
function computeMass(atoms) {
  return atoms.reduce((s, a) => s + (ATOM_MASS[a] || 1), 0);
}
function computeSizeFactor(atoms) {
  return 0.85 + 0.30 * Math.sqrt(computeMass(atoms) / 60);
}

// ★ 塔攻击 ×约 1.7，射程缩短 8~12%
const DEFS = {
  H:  { atoms:['H'],        name:'氢',      symbol:'H',    color:'#d8d8d8', stroke:'#888',    atk: 10, range:280, cd:0.9, hp: 80, tier:0 },
  O:  { atoms:['O'],        name:'氧',      symbol:'O',    color:'#ff5a5a', stroke:'#a02020', atk: 16, range:320, cd:1.3, hp: 90, tier:0 },
  Na: { atoms:['Na'],       name:'钠',      symbol:'Na',   color:'#f5a623', stroke:'#a06010', atk: 26, range:220, cd:1.6, hp:140, tier:0 },
  Cl: { atoms:['Cl'],       name:'氯',      symbol:'Cl',   color:'#82d94e', stroke:'#407020', atk: 18, range:300, cd:1.1, hp: 95, tier:0 },
  C:  { atoms:['C'],        name:'碳',      symbol:'C',    color:'#5a5a5a', stroke:'#222',    atk: 22, range:260, cd:1.5, hp:120, tier:0 },

  H2: { atoms:['H','H'],     name:'氢分子',   symbol:'H₂',   color:'#b8d8f0', stroke:'#6090c0', atk: 22, range:310, cd:0.7, hp:140, tier:1 },
  O2: { atoms:['O','O'],     name:'氧分子',   symbol:'O₂',   color:'#ff8080', stroke:'#c04040', atk: 32, range:350, cd:1.4, hp:170, tier:1 },
  HCl:{ atoms:['H','Cl'],    name:'盐酸',     symbol:'HCl',  color:'#a0ff80', stroke:'#408020', atk: 36, range:310, cd:1.2, hp:130, tier:1 },
  NaCl:{atoms:['Na','Cl'],   name:'氯化钠',   symbol:'NaCl', color:'#c8c8ff', stroke:'#6060c0', atk: 22, range:280, cd:1.6, hp:300, tier:1 },
  CO: { atoms:['C','O'],     name:'一氧化碳', symbol:'CO',   color:'#808080', stroke:'#303030', atk: 38, range:340, cd:1.5, hp:130, tier:1 },
  H2O:{ atoms:['H','H','O'], name:'水',      symbol:'H₂O',  color:'#80c8ff', stroke:'#4080c0', atk: 20, range:350, cd:1.0, hp:200, tier:2 },
  CO2:{ atoms:['C','O','O'], name:'二氧化碳', symbol:'CO₂',  color:'#b0b0b0', stroke:'#505050', atk: 46, range:380, cd:2.0, hp:150, tier:2, aoe:true },
};

const AURA_EFFECTS = {
  O:   { type:'damage', value:0.30, name:'助燃',
         desc:'光环 · 助燃\n相邻塔伤害 +30%\n（半径 140 世界单位）' },
  H2O: { type:'range',  value:0.20, name:'溶剂',
         desc:'光环 · 溶剂\n相邻塔射程 +20%\n（半径 140 世界单位）' },
};

const SPECIAL_REACTIONS = [
  { a:'Na', b:'H2O', damage:250, radius:460, hint:'Na + H₂O → 爆炸！', keep:'H2O' },
];

// ★ 敌人血量略降、伤害降 60%、金币略增
const ENEMY_TYPES = {
  basic: { name:'游荡体', hp: 25,  speed: 55, damage: 20,  radius: 26, color:'#ff5a5a', attackInterval: 1.0, score: 10,  gold: 6 },
  fast:  { name:'疾行体', hp: 15,  speed:110, damage: 12,  radius: 22, color:'#ffaa3a', attackInterval: 0.7, score: 15,  gold: 8 },
  tank:  { name:'重壳体', hp: 80,  speed: 35, damage: 40,  radius: 34, color:'#a06bd0', attackInterval: 1.5, score: 30,  gold: 15 },
  boss:  { name:'核心体', hp:400,  speed: 25, damage:100,  radius: 55, color:'#ff3060', attackInterval: 2.0, score: 200, gold: 80 },
};

// ★ 阶段成长系数（原来 0.30 太陡，现在放缓）
const STAGE_HP_GROWTH = 0.22;      // 血量成长
const STAGE_DMG_GROWTH = 0.15;     // 伤害成长
const STAGE_SPD_GROWTH = 0.02;     // 速度成长

const state = {
  gold: 200,
  coreHp: CORE_MAX_HP,
  coreMaxHp: CORE_MAX_HP,
  units: [],
  enemies: [],
  projectiles: [],
  explosions: [],
  particles: [],
  popups: [],
  hand: ['H', 'O', 'C'],
  selectedHand: -1,
  selectedUnit: null,
  selectedEnemy: null,
  selectedCore: false,       // ★
  hoveredUnit: null,
  mouseX: 0, mouseY: 0,
  time: 0,
  running: false,
  gameOver: false,
  paused: false,
  speedMultiplier: 1,
  spawnTimer: 2,
  spawnInterval: 2.5,
  stage: 1,
  stageTimer: 0,
  stageDuration: 25,
  kills: 0,
  score: 0,
  rollCost: 20,
  rollsUsed: 0,
  unitLimit: START_UNIT_LIMIT,
  unitLimitCost: 60,
  coreHitFlash: 0,
  maxStage: 1,
};

function isSubset(a, b) {
  const bCopy = [...b];
  for (const item of a) {
    const idx = bCopy.indexOf(item);
    if (idx === -1) return false;
    bCopy.splice(idx, 1);
  }
  return true;
}
function findMoleculeMatch(atoms) {
  const sorted = [...atoms].sort();
  for (const key in DEFS) {
    const def = DEFS[key];
    if (def.tier === 0 || def.isIntermediate) continue;
    const defSorted = [...def.atoms].sort();
    if (defSorted.length === sorted.length &&
        defSorted.every((v, i) => v === sorted[i])) return key;
  }
  return null;
}
function findSupersetMolecule(atoms) {
  const sorted = [...atoms].sort();
  let best = null;
  for (const key in DEFS) {
    const def = DEFS[key];
    if (def.tier === 0 || def.isIntermediate) continue;
    const defSorted = [...def.atoms].sort();
    if (defSorted.length <= sorted.length) continue;
    if (isSubset(sorted, defSorted)) {
      if (!best || defSorted.length < DEFS[best].atoms.length) best = key;
    }
  }
  return best;
}
function buildIntermediateSymbol(atoms) {
  const counts = {};
  for (const a of atoms) counts[a] = (counts[a] || 0) + 1;
  const subs = ['','₂','₃','₄','₅','₆','₇','₈','₉'];
  return Object.entries(counts).map(([k, v]) => v > 1 ? k + subs[v] : k).join('');
}

function createIntermediate(atoms, x, y) {
  const sorted = [...atoms].sort();
  const key = 'IM:' + sorted.join('+');
  if (!DEFS[key]) {
    DEFS[key] = {
      atoms: sorted,
      name: '过渡态',
      symbol: buildIntermediateSymbol(sorted),
      color: '#5a6a7a',
      stroke: '#384858',
      atk: 0, range: 0, cd: 999,
      hp: 100 * HP_SCALE,
      tier: 1,
      isIntermediate: true,
    };
  }
  const def = DEFS[key];
  const unit = {
    id: Math.random().toString(36).slice(2),
    key, x, y,
    radius: WORLD.TOWER_BASE_R * computeSizeFactor(sorted),
    hp: def.hp, maxHp: def.hp,
    baseAtk: 0, baseRange: 0, baseCd: 999,
    atk: 0, range: 0, cd: 999,
    cdTimer: 999,
    atoms: [...sorted],
    hitFlash: 0,
    bonusDamage: 0, bonusCooldown: 0, bonusRange: 0,
    isIntermediate: true,
  };
  state.units.push(unit);
  flashMessage(`过渡态 ${def.symbol}`, '#a0b8d0');
  return unit;
}
function placeUnit(key, x, y) {
  const def = DEFS[key];
  const unit = {
    id: Math.random().toString(36).slice(2),
    key, x, y,
    radius: WORLD.TOWER_BASE_R * computeSizeFactor(def.atoms),
    hp: def.hp * HP_SCALE,
    maxHp: def.hp * HP_SCALE,
    baseAtk: def.atk, baseRange: def.range, baseCd: def.cd,
    atk: def.atk, range: def.range, cd: def.cd,
    cdTimer: 0,
    atoms: [...def.atoms],
    hitFlash: 0,
    bonusDamage: 0, bonusCooldown: 0, bonusRange: 0,
    isIntermediate: false,
  };
  state.units.push(unit);
  return unit;
}
function removeUnit(u) {
  const idx = state.units.indexOf(u);
  if (idx >= 0) state.units.splice(idx, 1);
  if (state.selectedUnit === u) {
    state.selectedUnit = null;
    hideContextMenu();
  }
}
function getUnitAtWorld(wx, wy, screenPadding = 6) {
  const tol = screenPadding / camera.zoom;
  let best = null, bestD = Infinity;
  for (const u of state.units) {
    const d = Math.hypot(u.x - wx, u.y - wy);
    if (d < u.radius + tol && d < bestD) { best = u; bestD = d; }
  }
  return best;
}
function getEnemyAtWorld(wx, wy, screenPadding = 6) {
  const tol = screenPadding / camera.zoom;
  let best = null, bestD = Infinity;
  for (const e of state.enemies) {
    const d = Math.hypot(e.x - wx, e.y - wy);
    if (d < e.radius + tol && d < bestD) { best = e; bestD = d; }
  }
  return best;
}
// ★ 核心命中检测
function getCoreAtWorld(wx, wy, screenPadding = 6) {
  const tol = screenPadding / camera.zoom;
  return Math.hypot(wx, wy) < WORLD.CORE_RADIUS + tol;
}
function tryPlace(wx, wy) {
  const d = Math.hypot(wx, wy);
  if (d < WORLD.PLACE_MIN_R || d > WORLD.PLACE_MAX_R) return false;
  if (state.units.length >= state.unitLimit) return false;
  for (const u of state.units) {
    if (Math.hypot(u.x - wx, u.y - wy) < u.radius + WORLD.TOWER_BASE_R * 0.7) return false;
  }
  return true;
}

function synthesizeWithHand(unit, handKey) {
  if (!unit || !handKey) return false;

  for (const rx of SPECIAL_REACTIONS) {
    if ((unit.key === rx.a && handKey === rx.b) ||
        (unit.key === rx.b && handKey === rx.a)) {
      const exX = unit.x, exY = unit.y;
      triggerExplosion(exX, exY, rx.damage, rx.radius);
      flashMessage(rx.hint, '#ffaa3a');

      const unitIsKeep = unit.key === rx.keep;
      const handIsKeep = handKey === rx.keep;

      if (unitIsKeep) {
        // 场上是保留物，手牌消耗
      } else if (handIsKeep) {
        removeUnit(unit);
        placeUnit(handKey, exX, exY);
      } else {
        removeUnit(unit);
      }
      return true;
    }
  }

  const handDef = DEFS[handKey];
  if (!handDef) return false;
  const all = [...unit.atoms, ...handDef.atoms].sort();

  const molKey = findMoleculeMatch(all);
  if (molKey) {
    const x = unit.x, y = unit.y;
    removeUnit(unit);
    placeUnit(molKey, x, y);
    flashMessage(`合成 ${DEFS[molKey].name}`, '#6bc4ff');
    return true;
  }
  if (all.length >= 2) {
    const superKey = findSupersetMolecule(all);
    if (superKey) {
      const x = unit.x, y = unit.y;
      removeUnit(unit);
      createIntermediate(all, x, y);
      return true;
    }
  }
  flashMessage('该组合不稳定', '#ff5a5a');
  return false;
}

function triggerExplosion(x, y, damage, radius) {
  state.explosions.push({ x, y, radius, maxRadius: radius, life: 0.55, maxLife: 0.55 });
  for (const e of state.enemies) {
    const d = Math.hypot(e.x - x, e.y - y);
    if (d < radius) {
      const baseDmg = damage * (1 - d / radius * 0.5);
      const { dmg, isCrit } = calcDamage(baseDmg);
      e.hp -= dmg;
      showDamagePopup(e, dmg, { isCrit });
    }
  }
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 240 + 80;
    state.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.5 + Math.random() * 0.4, maxLife: 0.9,
      color: i % 2 ? '#ffaa3a' : '#ff6030', size: 8 + Math.random() * 8,
    });
  }
}

const toastContainer = document.getElementById('toastContainer');
function flashMessage(text, color = '#ffaa3a') {
  while (toastContainer.children.length >= 5) {
    toastContainer.firstChild.remove();
  }
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  el.style.color = color;
  el.style.borderColor = color;
  toastContainer.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

function pushPopup(p) {

}
function showDamagePopup(target, amount, opts = {}) {

function showCoreDamagePopup(amount) {

function recalcAuras() {
  for (const u of state.units) {
    u.bonusDamage = 0; u.bonusCooldown = 0; u.bonusRange = 0;
  }
  if (ENABLE_AURAS) {
    for (const src of state.units) {
      if (src.isIntermediate) continue;
      const aura = AURA_EFFECTS[src.key];
      if (!aura) continue;
      for (const tgt of state.units) {
        if (tgt === src || tgt.isIntermediate) continue;
        if (Math.hypot(tgt.x - src.x, tgt.y - src.y) < WORLD.AURA_RADIUS) {
          if (aura.type === 'damage')   tgt.bonusDamage   += aura.value;
          if (aura.type === 'cooldown') tgt.bonusCooldown += aura.value;
          if (aura.type === 'range')    tgt.bonusRange    += aura.value;
        }
      }
    }
  }
  for (const u of state.units) {
    if (u.isIntermediate) { u.atk = 0; u.range = 0; u.cd = 999; continue; }
    u.atk   = u.baseAtk   * (1 + u.bonusDamage);
    u.range = u.baseRange * (1 + u.bonusRange);
    u.cd    = Math.max(0.15, u.baseCd * (1 + u.bonusCooldown));
  }
}

function roll() {
  if (state.gameOver || !state.running || state.paused) return;
  if (state.gold < state.rollCost) { flashMessage('金币不足', '#ff5a5a'); return; }
  state.gold -= state.rollCost;
  showGoldPopup(-state.rollCost);
  const atomKeys = Object.keys(DEFS).filter(k => DEFS[k].tier === 0);
  const key = atomKeys[Math.floor(Math.random() * atomKeys.length)];
  state.hand.push(key);
  state.rollsUsed++;
  state.rollCost = Math.min(20 + state.rollsUsed * 3, 60);
  updateHUD();
  renderHand();
}
function buyUnitLimit() {
  if (state.gameOver || !state.running || state.paused) return;
  if (state.gold < state.unitLimitCost) { flashMessage('金币不足', '#ff5a5a'); return; }
  state.gold -= state.unitLimitCost;
  showGoldPopup(-state.unitLimitCost);
  state.unitLimit += 2;
  state.unitLimitCost = Math.floor(state.unitLimitCost * 1.6);
  flashMessage(`单位上限 → ${state.unitLimit}`, '#c8b8ff');
  updateHUD();
}
function sellUnit(u) {
  if (state.paused) return;
  const def = DEFS[u.key];
  const value = 8 + u.atoms.length * 6 + (def.tier || 0) * 12;
  state.gold += value;
  removeUnit(u);
  showGoldPopup(value);
  updateHUD();
}

function update(dt) {
  state.time += dt;
  state.stageTimer += dt;
  state.spawnTimer -= dt;
  if (state.coreHitFlash > 0) state.coreHitFlash -= dt;

  if (state.stageTimer >= state.stageDuration) {
    state.stageTimer = 0;
    state.stage++;
    state.maxStage = Math.max(state.maxStage, state.stage);
    state.spawnInterval = Math.max(0.5, 2.5 - state.stage * 0.15);
    flashMessage(`阶段 ${state.stage}`, '#c8b8ff');
  }

  if (state.spawnTimer <= 0) {
    spawnEnemy();
    state.spawnTimer = state.spawnInterval * (0.8 + Math.random() * 0.4);
  }

  updateEnemies(dt);
  recalcAuras();
  updateUnits(dt);

  for (let i = state.projectiles.length - 1; i >= 0; i--) {
    state.projectiles[i].life -= dt;
    if (state.projectiles[i].life <= 0) state.projectiles.splice(i, 1);
  }
  for (let i = state.explosions.length - 1; i >= 0; i--) {
    state.explosions[i].life -= dt;
    if (state.explosions[i].life <= 0) state.explosions.splice(i, 1);
  }
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life -= dt;
    if (p.life <= 0) state.particles.splice(i, 1);
  }
  for (let i = state.popups.length - 1; i >= 0; i--) {
    const p = state.popups[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy *= 0.94;
    p.life -= dt;
    if (p.life <= 0) state.popups.splice(i, 1);
  }

  if (state.selectedEnemy && !state.enemies.includes(state.selectedEnemy)) {
    state.selectedEnemy = null;
    hideContextMenu();
  }
  if (state.selectedUnit && !state.units.includes(state.selectedUnit)) {
    state.selectedUnit = null;
    hideContextMenu();
  }

  if (state.coreHp <= 0 && !state.gameOver) {
    state.coreHp = 0;
    gameOver();
  }
}

function spawnEnemy() {
  const angle = Math.random() * Math.PI * 2;
  const x = Math.cos(angle) * WORLD.SPAWN_R;
  const y = Math.sin(angle) * WORLD.SPAWN_R;

  let type = 'basic';
  const r = Math.random();
  if (state.stage >= 3 && r < 0.30) type = 'fast';
  if (state.stage >= 5 && r > 0.78) type = 'tank';
  if (state.stage >= 8 && state.stage % 8 === 0 && Math.random() < 0.10) type = 'boss';

  const t = ENEMY_TYPES[type];
  // ★ 成长放缓
  const hpScale = 1 + (state.stage - 1) * STAGE_HP_GROWTH;
  const dmgScale = 1 + (state.stage - 1) * STAGE_DMG_GROWTH;
  const spdScale = 1 + (state.stage - 1) * STAGE_SPD_GROWTH;

  state.enemies.push({
    x, y, type,
    hp: t.hp * hpScale, maxHp: t.hp * hpScale,
    speed: t.speed * spdScale,
    damage: t.damage * dmgScale,
    radius: t.radius,
    color: t.color,
    attackInterval: t.attackInterval,
    attackTimer: 0,
    score: t.score,
    gold: t.gold,
    attacking: false,
  });
}

function updateEnemies(dt) {
  for (const e of state.enemies) {
    if (e.hp <= 0) continue;

    let target = null, minDist = Infinity;
    for (const u of state.units) {
      const d = Math.hypot(u.x - e.x, u.y - e.y);
      const rng = u.radius + e.radius + 12;
      if (d < rng && d < minDist) { minDist = d; target = u; }
    }

    if (target) {
      e.attacking = false;
      e.attackTimer -= dt;
      if (e.attackTimer <= 0) {
        e.attackTimer = e.attackInterval;
        target.hp -= e.damage;
        target.hitFlash = 0.15;
        showDamagePopup(target, e.damage);
      }
    } else {
      const d = Math.hypot(e.x, e.y);
      if (d <= WORLD.CORE_RADIUS + e.radius + 2) {
        e.attacking = true;
        e.attackTimer -= dt;
        if (e.attackTimer <= 0) {
          e.attackTimer = e.attackInterval;
          state.coreHp -= e.damage;
          state.coreHitFlash = 0.2;
          showCoreDamagePopup(e.damage);
          for (let i = 0; i < 6; i++) {
            const a = Math.random() * Math.PI * 2;
            state.particles.push({
              x: Math.cos(a) * WORLD.CORE_RADIUS,
              y: Math.sin(a) * WORLD.CORE_RADIUS,
              vx: Math.cos(a) * 120, vy: Math.sin(a) * 120,
              life: 0.4, maxLife: 0.4, color:'#ff5a5a', size: 4,
            });
          }
        }
      } else {
        e.attacking = false;
        e.x += (-e.x / d) * e.speed * dt;
        e.y += (-e.y / d) * e.speed * dt;
      }
    }
  }

  state.enemies = state.enemies.filter(e => {
    if (e.hp <= 0) {
      state.kills++;
      state.gold += e.gold;
      showGoldPopup(e.gold);
      const scoreGain = e.score * (1 + Math.floor((state.stage - 1) * 0.15));
      state.score += scoreGain;
      showScorePopup(scoreGain);
      for (let i = 0; i < 6; i++) {
        const a = Math.random() * Math.PI * 2;
        state.particles.push({
          x: e.x, y: e.y,
          vx: Math.cos(a) * 100, vy: Math.sin(a) * 100,
          life: 0.4, maxLife: 0.4, color: e.color, size: 4,
        });
      }
      return false;
    }
    return true;
  });

  state.units = state.units.filter(u => u.hp > 0);
}

function updateUnits(dt) {
  for (const u of state.units) {
    if (u.isIntermediate) continue;
    u.cdTimer -= dt;
    if (u.hitFlash > 0) u.hitFlash -= dt;

    let target = null, minDist = Infinity;
    for (const e of state.enemies) {
      const d = Math.hypot(e.x - u.x, e.y - u.y);
      if (d < u.range && d < minDist) { minDist = d; target = e; }
    }

    if (target && u.cdTimer <= 0) {
      u.cdTimer = u.cd;
      const def = DEFS[u.key];

      if (def.aoe) {
        for (const e of state.enemies) {
          if (Math.hypot(e.x - u.x, e.y - u.y) < u.range) {
            const { dmg, isCrit } = calcDamage(u.atk);
            e.hp -= dmg;
            showDamagePopup(e, dmg, { isCrit });
          }
        }
        state.explosions.push({
          x: target.x, y: target.y,
          radius: 80, maxRadius: 80, life: 0.25, maxLife: 0.25,
        });
      } else {
        const { dmg, isCrit } = calcDamage(u.atk);
        target.hp -= dmg;
        showDamagePopup(target, dmg, { isCrit });
      }

      state.projectiles.push({
        x1: u.x, y1: u.y,
        x2: target.x, y2: target.y,
        life: 0.12, maxLife: 0.12,
        color: u.color || DEFS[u.key].color,
      });
    }
  }
}

const menuEl = document.getElementById('contextMenu');

let menuCacheKey = '';

function hideContextMenu() {
  menuEl.classList.add('hidden');
  menuTargetRef = null;
  menuCacheKey = '';
  state.selectedCore = false;
}

}

  if (ENABLE_AURAS && unit.bonusRange > 0) parts.push(`✦ 受光环：射程 +${(unit.bonusRange * 100).toFixed(0)}%`);
  if (ENABLE_AURAS && unit.bonusCooldown < 0) parts.push(`✦ 受光环：冷却 ${(unit.bonusCooldown * 100).toFixed(0)}%`);

function refreshMenuContent() {
  if (menuEl.classList.contains('hidden')) {
    menuTargetRef = null;
    menuCacheKey = '';
    return;
  }

  // ★ 核心优先
  if (state.selectedCore) {
    const key = `C|${Math.ceil(state.coreHp)}|${state.stage}|${Math.floor(state.time)}|${state.score}`;
    if (menuTargetRef === 'CORE' && menuCacheKey === key) return;
    menuTargetRef = 'CORE';
    menuCacheKey = key;
    buildCoreMenu();
    return;
  }

  let target = null, isEnemy = false;
  if (state.selectedUnit && state.units.includes(state.selectedUnit)) {
    target = state.selectedUnit;
  } else if (state.selectedEnemy && state.enemies.includes(state.selectedEnemy)) {
    target = state.selectedEnemy;
    isEnemy = true;
  } else {
    hideContextMenu();
    return;
  }

  const hp = Math.max(0, Math.ceil(target.hp));
  const key = isEnemy
    ? `E|${hp}|${target.attacking}`
    : `U|${hp}|${target.atk.toFixed(1)}|${Math.floor(target.range)}|${target.cd.toFixed(1)}|${target.bonusDamage}|${target.bonusRange}|${target.bonusCooldown}`;

  if (menuTargetRef === target && menuCacheKey === key) return;
  menuTargetRef = target;
  menuCacheKey = key;

  if (isEnemy) buildEnemyMenu(target);
  else buildUnitMenu(target);
}

function updateMenuPosition() {
  if (menuEl.classList.contains('hidden')) return;

  // ★ 核心：位置是 (0,0)
  let targetX = 0, targetY = 0, radius = WORLD.CORE_RADIUS;
  if (state.selectedCore) {
    targetX = 0; targetY = 0; radius = WORLD.CORE_RADIUS;
  } else {
    let target = null;
    if (state.selectedUnit) target = state.selectedUnit;
    else if (state.selectedEnemy) target = state.selectedEnemy;
    if (!target) { hideContextMenu(); return; }
    targetX = target.x;
    targetY = target.y;
    radius = target.radius;
  }

  const [sx, sy] = worldToScreen(targetX, targetY);
  const menuWidth = menuEl.offsetWidth || 240;
  const menuHeight = menuEl.offsetHeight || 200;
  const screenRadius = radius * camera.zoom;
  let mx = sx + screenRadius + 14;
  let my = sy - menuHeight / 2;
  if (mx + menuWidth > window.innerWidth - 12) mx = sx - screenRadius - menuWidth - 14;
  if (mx < 12) mx = 12;
  if (my < 12) my = 12;
  if (my + menuHeight > window.innerHeight - 12) my = window.innerHeight - menuHeight - 12;
  menuEl.style.left = mx + 'px';
  menuEl.style.top = my + 'px';
}

function render() {
  ctx.fillStyle = '#07070c';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  applyCamera();

  const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, WORLD.SPAWN_R * 1.2);
  grad.addColorStop(0, 'rgba(28, 38, 68, 0.55)');
  grad.addColorStop(1, 'rgba(7, 7, 12, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(-WORLD.SPAWN_R * 1.5, -WORLD.SPAWN_R * 1.5,
               WORLD.SPAWN_R * 3, WORLD.SPAWN_R * 3);

  ctx.beginPath();
  ctx.arc(0, 0, WORLD.PLACE_MAX_R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(107, 196, 255, 0.10)';
  ctx.lineWidth = 1 / camera.zoom * 1.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, WORLD.PLACE_MIN_R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(107, 196, 255, 0.10)';
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0, 0, WORLD.SPAWN_R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255, 90, 90, 0.14)';
  ctx.lineWidth = 1 / camera.zoom * 2;
  ctx.setLineDash([20 / camera.zoom, 20 / camera.zoom]);
  ctx.stroke();
  ctx.setLineDash([]);

  if (ENABLE_AURAS) {
    for (const u of state.units) {
      if (u.isIntermediate) continue;
      if (!AURA_EFFECTS[u.key]) continue;
      ctx.beginPath();
      ctx.arc(u.x, u.y, WORLD.AURA_RADIUS, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 200, 100, 0.22)';
      ctx.lineWidth = 1 / camera.zoom * 1.5;
      ctx.setLineDash([6 / camera.zoom, 8 / camera.zoom]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  if (ENABLE_AURAS) {
    for (let i = 0; i < state.units.length; i++) {
      for (let j = i + 1; j < state.units.length; j++) {
        const a = state.units[i], b = state.units[j];
        if (a.isIntermediate || b.isIntermediate) continue;
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < WORLD.AURA_RADIUS) {
          const hasAura = AURA_EFFECTS[a.key] || AURA_EFFECTS[b.key];
          if (hasAura) {
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = 'rgba(255, 200, 100, 0.35)';
            ctx.lineWidth = 1.5 / camera.zoom * 1.5;
            ctx.setLineDash([5 / camera.zoom, 5 / camera.zoom]);
            ctx.stroke();
            ctx.setLineDash([]);
          }
        }
      }
    }
  }

  // 核心光晕
  const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, WORLD.CORE_RADIUS * 2.4);
  coreGrad.addColorStop(0, 'rgba(107, 196, 255, 0.55)');
  coreGrad.addColorStop(0.5, 'rgba(107, 196, 255, 0.12)');
  coreGrad.addColorStop(1, 'rgba(107, 196, 255, 0)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(0, 0, WORLD.CORE_RADIUS * 2.4, 0, Math.PI * 2);
  ctx.fill();

  // ★ 选中核心时高亮
  if (state.selectedCore) {
    ctx.beginPath();
    ctx.arc(0, 0, WORLD.CORE_RADIUS + 22, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 3 / camera.zoom;
    ctx.setLineDash([10 / camera.zoom, 6 / camera.zoom]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.beginPath();
  ctx.arc(0, 0, WORLD.CORE_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = state.coreHitFlash > 0 ? '#3a1a2a' : '#12182a';
  ctx.fill();
  ctx.strokeStyle = state.coreHitFlash > 0 ? '#ff5a5a' : '#6bc4ff';
  ctx.lineWidth = 2 / camera.zoom * 1.2;
  ctx.stroke();

  const hpPct = Math.max(0, state.coreHp / state.coreMaxHp);
  ctx.beginPath();
  ctx.arc(0, 0, WORLD.CORE_RADIUS + 14, -Math.PI / 2,
          -Math.PI / 2 + Math.PI * 2 * hpPct);
  ctx.strokeStyle = hpPct > 0.5 ? '#6bc4ff' : hpPct > 0.25 ? '#ffaa3a' : '#ff5a5a';
  ctx.lineWidth = 6 / camera.zoom * 1.2;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.lineCap = 'butt';

  ctx.fillStyle = state.coreHitFlash > 0 ? '#ff5a5a' : '#6bc4ff';
  ctx.font = `bold ${WORLD.CORE_RADIUS * 0.75}px system-ui`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('核', 0, 0);

  for (const u of state.units) {
    drawUnit(u, u === state.selectedUnit);
  }

  if (state.selectedHand >= 0 && state.hoveredUnit) {
    const hover = state.hoveredUnit;
    const handKey = state.hand[state.selectedHand];
    const merged = [...hover.atoms, ...DEFS[handKey].atoms].sort();
    const molKey = findMoleculeMatch(merged);
    let previewSym = null;
    if (molKey) previewSym = DEFS[molKey].symbol;
    else if (merged.length >= 2 && findSupersetMolecule(merged)) {
      previewSym = buildIntermediateSymbol(merged);
    }

    let specialReaction = null;
    for (const rx of SPECIAL_REACTIONS) {
      if ((hover.key === rx.a && handKey === rx.b) ||
          (hover.key === rx.b && handKey === rx.a)) {
        specialReaction = rx;
        break;
      }
    }
    const isSpecial = !!specialReaction;

    if (isSpecial) {
      ctx.beginPath();
      ctx.arc(hover.x, hover.y, specialReaction.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 170, 58, 0.10)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(hover.x, hover.y, specialReaction.radius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 170, 58, 0.75)';
      ctx.lineWidth = 2.5 / camera.zoom;
      ctx.setLineDash([14 / camera.zoom, 8 / camera.zoom]);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.beginPath();
      ctx.arc(hover.x, hover.y, hover.radius + 4 / camera.zoom, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 170, 58, 0.25)';
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(hover.x, hover.y, hover.radius + 14 / camera.zoom, 0, Math.PI * 2);
    ctx.strokeStyle = isSpecial ? '#ffaa3a' : (previewSym ? '#6bc4ff' : '#ff5a5a');
    ctx.lineWidth = 3 / camera.zoom;
    ctx.stroke();

    ctx.fillStyle = isSpecial ? '#ffaa3a' : (previewSym ? '#6bc4ff' : '#ff5a5a');
    ctx.font = `bold ${18 / camera.zoom}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(
      previewSym ? `→ ${previewSym}` : (isSpecial ? '→ 反应' : '不可合成'),
      hover.x, hover.y - hover.radius - 20 / camera.zoom
    );

    if (isSpecial) {
      ctx.fillStyle = 'rgba(255, 200, 100, 0.9)';
      ctx.font = `bold ${14 / camera.zoom}px system-ui`;
      ctx.fillText(
        `爆炸半径 ${specialReaction.radius}`,
        hover.x, hover.y - hover.radius - 44 / camera.zoom
      );
    }
  }

  for (const e of state.enemies) {
    drawEnemy(e, e === state.selectedEnemy);
  }

  for (const p of state.projectiles) {
    const t = p.life / p.maxLife;
    ctx.beginPath();
    ctx.moveTo(p.x1, p.y1);
    ctx.lineTo(p.x2, p.y2);
    ctx.strokeStyle = p.color;
    ctx.globalAlpha = t;
    ctx.lineWidth = 4 / camera.zoom;
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.lineCap = 'butt';

  for (const ex of state.explosions) {
    const t = 1 - ex.life / ex.maxLife;
    const r = ex.maxRadius * (0.3 + t * 0.7);
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 170, 58, ${1 - t})`;
    ctx.lineWidth = 5 / camera.zoom;
    ctx.stroke();
    const g = ctx.createRadialGradient(ex.x, ex.y, 0, ex.x, ex.y, r);
    g.addColorStop(0, `rgba(255, 210, 120, ${(1 - t) * 0.7})`);
    g.addColorStop(1, 'rgba(255, 100, 30, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const p of state.particles) {
    const t = p.life / p.maxLife;
    ctx.globalAlpha = Math.min(1, t * 1.5);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(1, p.size * t), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const p of state.popups) {
    if (!p.isWorld) continue;
    drawPopup(p, true);
  }

  if (state.selectedHand >= 0 && !state.hoveredUnit) {
    const handKey = state.hand[state.selectedHand];
    const def = DEFS[handKey];
    const [wx, wy] = screenToWorld(state.mouseX, state.mouseY);
    const valid = tryPlace(wx, wy);
    const previewR = WORLD.TOWER_BASE_R * computeSizeFactor(def.atoms);

    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.arc(wx, wy, previewR, 0, Math.PI * 2);
    ctx.fillStyle = valid ? 'rgba(107, 196, 255, 0.35)' : 'rgba(255, 90, 90, 0.35)';
    ctx.fill();
    ctx.strokeStyle = valid ? '#6bc4ff' : '#ff5a5a';
    ctx.lineWidth = 2 / camera.zoom;
    ctx.stroke();
    if (def && def.range > 0) {
      ctx.beginPath();
      ctx.arc(wx, wy, def.range, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(107, 196, 255, 0.25)';
      ctx.lineWidth = 1 / camera.zoom;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  for (const p of state.popups) {
    if (p.isWorld) continue;
    drawPopup(p, false);
  }

  refreshMenuContent();
  updateMenuPosition();
}

function drawPopup(p, isWorld) {
  const t = p.life / p.maxLife;
  const alpha = t < 0.4 ? t / 0.4 : 1;
  ctx.globalAlpha = alpha;
  ctx.font = `800 ${p.size}px system-ui`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const lw = isWorld ? 3 / camera.zoom : 3;
  ctx.lineWidth = lw;
  ctx.strokeStyle = p.isCrit ? 'rgba(80,0,0,0.85)' : 'rgba(0,0,0,0.75)';
  ctx.strokeText(p.text, p.x, p.y);

  if (p.isCrit) {
    ctx.shadowColor = p.color;
    ctx.shadowBlur = isWorld ? 12 / camera.zoom : 12;
  }
  ctx.fillStyle = p.color;
  ctx.fillText(p.text, p.x, p.y);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

function drawUnit(u, showRange) {
  const def = DEFS[u.key];
  const r = u.radius;

  if (showRange && !u.isIntermediate && u.range > 0) {
    ctx.beginPath();
    ctx.arc(u.x, u.y, u.range, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(107, 196, 255, 0.06)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(107, 196, 255, 0.55)';
    ctx.lineWidth = 2 / camera.zoom;
    ctx.setLineDash([10 / camera.zoom, 6 / camera.zoom]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if (u.isIntermediate) {
    ctx.beginPath();
    ctx.arc(u.x, u.y + 4, r + 2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(u.x, u.y, r, 0, Math.PI * 2);
    ctx.fillStyle = def.color;
    ctx.fill();
    ctx.strokeStyle = '#a0b8d0';
    ctx.lineWidth = 3 / camera.zoom;
    ctx.setLineDash([6 / camera.zoom, 4 / camera.zoom]);
    ctx.stroke();
    ctx.setLineDash([]);

    if (u.hitFlash > 0) {
      ctx.beginPath();
      ctx.arc(u.x, u.y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${(u.hitFlash / 0.15) * 0.5})`;
      ctx.fill();
    }

    ctx.fillStyle = '#d0e0f0';
    ctx.font = `bold ${Math.max(14, r * 0.75)}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(def.symbol, u.x, u.y);

    ctx.fillStyle = '#a0b8d0';
    ctx.font = `bold ${Math.max(12, r * 0.5)}px system-ui`;
    ctx.fillText('*', u.x + r * 0.7, u.y - r * 0.7);

    drawHpArc(u, r + 14 / camera.zoom);
    return;
  }

  ctx.beginPath();
  ctx.arc(u.x, u.y + 4, r + 3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(u.x, u.y, r, 0, Math.PI * 2);
  ctx.fillStyle = def.color;
  ctx.fill();
  ctx.strokeStyle = def.stroke;
  ctx.lineWidth = 3 / camera.zoom;
  ctx.stroke();

  if (showRange) {
    ctx.beginPath();
    ctx.arc(u.x, u.y, r + 10, 0, Math.PI * 2);
    ctx.strokeStyle = '#6bc4ff';
    ctx.lineWidth = 3 / camera.zoom;
    ctx.stroke();
  }

  if (u.hitFlash > 0) {
    ctx.beginPath();
    ctx.arc(u.x, u.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${(u.hitFlash / 0.15) * 0.5})`;
    ctx.fill();
  }

  ctx.fillStyle = def.tier === 0 ? '#111' : '#fff';
  ctx.font = `bold ${Math.max(14, r * 0.85)}px system-ui`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(def.symbol, u.x, u.y);

  if (ENABLE_AURAS && AURA_EFFECTS[u.key]) {
    ctx.fillStyle = '#ffd166';
    ctx.font = `bold ${Math.max(12, r * 0.55)}px system-ui`;
    ctx.fillText('◉', u.x + r * 0.75, u.y - r * 0.75);
  }
  if (ENABLE_AURAS && !AURA_EFFECTS[u.key] &&
      (u.bonusDamage > 0 || u.bonusRange > 0 || u.bonusCooldown < 0)) {
    ctx.fillStyle = '#6bc4ff';
    ctx.font = `bold ${Math.max(12, r * 0.5)}px system-ui`;
    ctx.fillText('✦', u.x + r * 0.7, u.y - r * 0.7);
  }

  drawHpArc(u, r + 14 / camera.zoom);
}

function drawHpArc(u, arcR) {
  if (u.hp >= u.maxHp) return;
  const pct = Math.max(0, Math.min(1, u.hp / u.maxHp));
  const startA = Math.PI * 0.75;
  const spanA  = Math.PI * 0.5;
  const lineW  = 7 / camera.zoom;

  ctx.beginPath();
  ctx.arc(u.x, u.y, arcR, startA, startA - spanA, true);
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
  ctx.lineWidth = lineW;
  ctx.lineCap = 'round';
  ctx.stroke();

  if (pct > 0.005) {
    const currentEnd = startA - spanA * pct;
    ctx.beginPath();
    ctx.arc(u.x, u.y, arcR, startA, currentEnd, true);
    ctx.strokeStyle = pct > 0.5 ? '#6be86b' : pct > 0.25 ? '#ffaa3a' : '#ff5a5a';
    ctx.lineWidth = lineW;
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
}

function drawEnemy(e, selected) {
  const pulse = 1 + Math.sin(state.time * 5 + e.x * 0.01) * 0.06;
  const r = e.radius * pulse;
  const pct = Math.max(0, e.hp / e.maxHp);

  ctx.beginPath();
  ctx.arc(e.x, e.y, r + 12, 0, Math.PI * 2);
  ctx.fillStyle = hexToRgba(e.color, 0.14);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
  ctx.fillStyle = hexToRgba(e.color, 0.28);
  ctx.fill();

  ctx.save();
  ctx.beginPath();
  ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
  ctx.clip();
  const fillH = r * 2 * pct;
  const fillTop = e.y + r - fillH;
  ctx.fillStyle = e.color;
  ctx.fillRect(e.x - r, fillTop, r * 2, fillH);
  if (pct > 0.02 && pct < 0.98) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.fillRect(e.x - r, fillTop, r * 2, 2 / camera.zoom);
  }
  ctx.restore();

  if (selected) {
    ctx.beginPath();
    ctx.arc(e.x, e.y, r + 10, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 3 / camera.zoom;
    ctx.setLineDash([6 / camera.zoom, 4 / camera.zoom]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.beginPath();
  ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2 / camera.zoom;
  ctx.stroke();

  if (e.attacking) {
    ctx.beginPath();
    ctx.arc(e.x, e.y, r + 6, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 90, 90, ${0.4 + Math.sin(state.time * 10) * 0.3})`;
    ctx.lineWidth = 3 / camera.zoom;
    ctx.stroke();
  }
}

function updateHUD() {
  document.getElementById('goldDisplay').textContent = Math.floor(state.gold);
  document.getElementById('hpDisplay').textContent = Math.max(0, Math.floor(state.coreHp));
  document.getElementById('scoreDisplay').textContent = state.score;
  document.getElementById('killDisplay').textContent = state.kills;
  const m = Math.floor(state.time / 60);
  const s = Math.floor(state.time % 60);
  document.getElementById('timeDisplay').textContent =
    `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  document.getElementById('unitDisplay').textContent =
    `${state.units.length}/${state.unitLimit}`;
  document.getElementById('stageDisplay').textContent = state.stage;
  document.getElementById('enemyDisplay').textContent = state.enemies.length;

  const rollBtn = document.getElementById('rollBtn');
  rollBtn.textContent = `抽卡 · ${state.rollCost}金`;
  rollBtn.disabled = state.gold < state.rollCost || state.gameOver || state.paused;

  const buyBtn = document.getElementById('buyLimitBtn');
  buyBtn.textContent = `扩容 · ${state.unitLimitCost}金 (+2)`;
  buyBtn.disabled = state.gold < state.unitLimitCost || state.gameOver || state.paused;
}

function renderHand() {
  const container = document.getElementById('hand');
  container.innerHTML = '';
  for (let i = 0; i < state.hand.length; i++) {
    const key = state.hand[i];
    const def = DEFS[key];
    const slot = document.createElement('div');
    slot.className = 'hand-slot';
    if (i === state.selectedHand) slot.classList.add('selected');
    slot.textContent = def.symbol;
    slot.style.background = def.color;
    slot.style.color = def.tier === 0 ? '#111' : '#fff';
    slot.style.textShadow = def.tier === 0 ? 'none' : '0 1px 3px rgba(0,0,0,0.6)';
    slot.onclick = () => {
      if (state.paused || state.gameOver || !state.running) return;
      state.selectedHand = (state.selectedHand === i) ? -1 : i;
      if (state.selectedHand >= 0) {
        state.selectedUnit = null;
        state.selectedEnemy = null;
        state.selectedCore = false;
        hideContextMenu();
      }
      renderHand();
    };
    container.appendChild(slot);
  }
}

function gameOver() {
  state.gameOver = true;
  state.running = false;
  state.paused = false;
  updatePauseUI();
  hideContextMenu();
  toastContainer.innerHTML = '';
  const m = Math.floor(state.time / 60);
  const s = Math.floor(state.time % 60);
  document.getElementById('finalScore').textContent = state.score;
  document.getElementById('finalTime').textContent =
    `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  document.getElementById('finalKills').textContent = state.kills;
  document.getElementById('finalStage').textContent = state.maxStage;
  document.getElementById('gameOver').classList.remove('hidden');
  document.querySelector('.panel').style.display = 'none';
  document.querySelector('.view-controls').style.display = 'none';
}

let pointerDown = false;
let pointerStartX = 0, pointerStartY = 0;
let panStartCamX = 0, panStartCamY = 0;
let hasDragged = false;
let activeButton = -1;

canvas.addEventListener('pointerdown', (e) => {
  if (state.paused || state.gameOver || !state.running) return;
  if (e.button === 1) e.preventDefault();
  pointerDown = true;
  activeButton = e.button;
  pointerStartX = e.clientX;
  pointerStartY = e.clientY;
  panStartCamX = camera.x;
  panStartCamY = camera.y;
  hasDragged = false;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
  const rect = canvas.getBoundingClientRect();
  state.mouseX = e.clientX - rect.left;
  state.mouseY = e.clientY - rect.top;

  if (pointerDown && !state.paused) {
    const dx = e.clientX - pointerStartX;
    const dy = e.clientY - pointerStartY;
    if (!hasDragged && Math.hypot(dx, dy) > 5) hasDragged = true;
    if (hasDragged) {
      camera.x = panStartCamX - dx / camera.zoom;
      camera.y = panStartCamY - dy / camera.zoom;
      hideContextMenu();
      state.selectedUnit = null;
      state.selectedEnemy = null;
      state.selectedCore = false;
    }
  }

  const [wx, wy] = screenToWorld(state.mouseX, state.mouseY);
  state.hoveredUnit = getUnitAtWorld(wx, wy);

  if (state.paused || state.gameOver || !state.running) {
    canvas.style.cursor = 'default';
    return;
  }
  if (hasDragged) canvas.style.cursor = 'grabbing';
  else if (state.selectedHand >= 0) canvas.style.cursor = 'crosshair';
  else if (state.hoveredUnit) canvas.style.cursor = 'pointer';
  else {
    const hoverE = getEnemyAtWorld(wx, wy);
    const hoverCore = !hoverE && getCoreAtWorld(wx, wy);
    canvas.style.cursor = (hoverE || hoverCore) ? 'pointer' : 'grab';
  }
});

canvas.addEventListener('pointerup', (e) => {
  if (!pointerDown) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  if (!hasDragged && !state.paused) handleClick(x, y, activeButton);
  pointerDown = false;
  hasDragged = false;
  activeButton = -1;
  try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
});

canvas.addEventListener('pointercancel', () => {
  pointerDown = false;
  hasDragged = false;
  activeButton = -1;
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (state.paused || state.gameOver || !state.running) return;
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;

  const before = screenToWorld(sx, sy);
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  camera.zoom = clamp(camera.zoom * factor,
                      camera.fitZoom * 0.3,
                      camera.fitZoom * 4);
  const after = screenToWorld(sx, sy);
  camera.x += before[0] - after[0];
  camera.y += before[1] - after[1];
  updateZoomDisplay();
}, { passive: false });

canvas.addEventListener('dblclick', () => {
  if (state.paused || state.gameOver || !state.running) return;
  resetCamera();
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function handleClick(sx, sy, button) {
  if (!state.running || state.gameOver || state.paused) return;
  const [wx, wy] = screenToWorld(sx, sy);
  const clickedUnit = getUnitAtWorld(wx, wy);
  // ★ 核心优先于敌人
  const clickedCore = !clickedUnit && getCoreAtWorld(wx, wy);
  const clickedEnemy = (!clickedUnit && !clickedCore) ? getEnemyAtWorld(wx, wy) : null;

  if (button === 2) {
    if (clickedUnit) {
      sellUnit(clickedUnit);
      state.selectedUnit = null;
      state.selectedEnemy = null;
      state.selectedCore = false;
      hideContextMenu();
    }
    return;
  }
  if (button !== 0) return;

  if (state.selectedHand >= 0) {
    const handKey = state.hand[state.selectedHand];
    if (clickedUnit) {
      const ok = synthesizeWithHand(clickedUnit, handKey);
      if (ok) {
        state.hand.splice(state.selectedHand, 1);
        state.selectedHand = -1;
        renderHand();
        updateHUD();
      }
      return;
    }
    if (tryPlace(wx, wy)) {
      placeUnit(handKey, wx, wy);
      state.hand.splice(state.selectedHand, 1);
      state.selectedHand = -1;
      renderHand();
      updateHUD();
    } else {
      flashMessage('无法放置', '#ff5a5a');
    }
    return;
  }

  if (clickedUnit) {
    if (state.selectedUnit === clickedUnit) {
      state.selectedUnit = null;
      hideContextMenu();
    } else {
      state.selectedUnit = clickedUnit;
      state.selectedEnemy = null;
      state.selectedCore = false;
      menuTargetRef = null;
      menuCacheKey = '';
      buildUnitMenu(clickedUnit);
      menuEl.classList.remove('hidden');
      updateMenuPosition();
    }
    return;
  }

  // ★ 核心
  if (clickedCore) {
    if (state.selectedCore) {
      state.selectedCore = false;
      hideContextMenu();
    } else {
      state.selectedUnit = null;
      state.selectedEnemy = null;
      state.selectedCore = true;
      menuTargetRef = null;
      menuCacheKey = '';
      buildCoreMenu();
      menuEl.classList.remove('hidden');
      updateMenuPosition();
    }
    return;
  }

  if (clickedEnemy) {
    if (state.selectedEnemy === clickedEnemy) {
      state.selectedEnemy = null;
      hideContextMenu();
    } else {
      state.selectedUnit = null;
      state.selectedCore = false;
      state.selectedEnemy = clickedEnemy;
      menuTargetRef = null;
      menuCacheKey = '';
      buildEnemyMenu(clickedEnemy);
      menuEl.classList.remove('hidden');
      updateMenuPosition();
    }
    return;
  }

  state.selectedUnit = null;
  state.selectedEnemy = null;
  state.selectedCore = false;
  hideContextMenu();
}

document.getElementById('rollBtn').onclick = roll;
document.getElementById('buyLimitBtn').onclick = buyUnitLimit;
document.getElementById('restartBtn').onclick = reset;
document.getElementById('zoomInBtn').onclick = () => {
  if (state.paused) return;
  camera.zoom = clamp(camera.zoom * 1.25, camera.fitZoom * 0.3, camera.fitZoom * 4);
  updateZoomDisplay();
};
document.getElementById('zoomOutBtn').onclick = () => {
  if (state.paused) return;
  camera.zoom = clamp(camera.zoom / 1.25, camera.fitZoom * 0.3, camera.fitZoom * 4);
  updateZoomDisplay();
};
document.getElementById('resetViewBtn').onclick = () => {
  if (state.paused) return;
  resetCamera();
};

function togglePause() {
  if (state.gameOver || !state.running) return;
  state.paused = !state.paused;
  updatePauseUI();
}

function cycleSpeed() {
  if (state.paused) return;
  const speeds = [1, 2, 4];
  const idx = speeds.indexOf(state.speedMultiplier);
  state.speedMultiplier = speeds[(idx + 1) % speeds.length];
  updateSpeedUI();
}

function setSpeed(v) {
  if (state.paused) return;
  state.speedMultiplier = v;
  updateSpeedUI();
}

function updatePauseUI() {
  const overlay = document.getElementById('pauseOverlay');
  const btn = document.getElementById('pauseBtn');
  if (state.paused) {
    overlay.classList.remove('hidden');
    btn.textContent = '▶';
    btn.title = '继续 (空格)';
    btn.classList.add('active');
    hideContextMenu();
  } else {
    overlay.classList.add('hidden');
    btn.textContent = '⏸';
    btn.title = '暂停 (空格)';
    btn.classList.remove('active');
  }
}

function updateSpeedUI() {
  const btn = document.getElementById('speedBtn');
  btn.textContent = '×' + state.speedMultiplier;
  if (state.speedMultiplier > 1) btn.classList.add('active');
  else btn.classList.remove('active');
}

document.getElementById('pauseBtn').onclick = togglePause;
document.getElementById('speedBtn').onclick = cycleSpeed;

document.getElementById('pauseOverlay').addEventListener('click', (e) => {
  e.stopPropagation();
  togglePause();
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.code === 'Space') {
    e.preventDefault();
    togglePause();
    return;
  }

  if (state.paused) return;

  if (e.code === 'Digit1') setSpeed(1);
  else if (e.code === 'Digit2') setSpeed(2);
  else if (e.code === 'Digit3') setSpeed(4);
});

document.addEventListener('click', (e) => {
  if (menuEl.classList.contains('hidden')) return;
  if (menuEl.contains(e.target)) return;
  if (e.target === canvas) return;
  state.selectedUnit = null;
  state.selectedEnemy = null;
  state.selectedCore = false;
  hideContextMenu();
});

function reset() {
  for (const key in DEFS) {
    if (DEFS[key].isIntermediate) delete DEFS[key];
  }
  state.gold = 200;
  state.coreHp = CORE_MAX_HP;
  state.coreMaxHp = CORE_MAX_HP;
  state.units = [];
  state.enemies = [];
  state.projectiles = [];
  state.explosions = [];
  state.particles = [];
  state.popups = [];
  state.hand = ['H', 'O', 'C'];
  state.selectedHand = -1;
  state.selectedUnit = null;
  state.selectedEnemy = null;
  state.selectedCore = false;
  state.hoveredUnit = null;
  state.time = 0;
  state.running = true;
  state.gameOver = false;
  state.paused = false;
  state.speedMultiplier = 1;
  state.spawnTimer = 2;
  state.spawnInterval = 2.5;
  state.stage = 1;
  state.maxStage = 1;
  state.stageTimer = 0;
  state.kills = 0;
  state.score = 0;
  state.rollCost = 20;
  state.rollsUsed = 0;
  state.unitLimit = START_UNIT_LIMIT;
  state.unitLimitCost = 60;
  state.coreHitFlash = 0;
  toastContainer.innerHTML = '';
  hideContextMenu();
  resetCamera();
  updatePauseUI();
  updateSpeedUI();
  document.getElementById('gameOver').classList.add('hidden');
  document.querySelector('.panel').style.display = 'flex';
  document.querySelector('.view-controls').style.display = 'flex';
  updateHUD();
  renderHand();
}

const MAX_STEP = 1 / 60;
function stepUpdate(totalDt) {
  let remaining = totalDt;
  let safety = 0;
  while (remaining > 0.0001 && safety < 30) {
    const step = Math.min(remaining, MAX_STEP);
    update(step);
    remaining -= step;
    safety++;
  }
}

let lastTime = 0;
function loop(now) {
  if (!lastTime) lastTime = now;
  const realDt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (state.running && !state.gameOver && !state.paused) {
    stepUpdate(realDt * state.speedMultiplier);
    updateHUD();
  }
  render();
  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(loop);
</script>
</body>
